:root[data-font="moderna"]{--f-d:"Plus Jakarta Sans",system-ui,sans-serif;--f-b:"Plus Jakarta Sans",system-ui,sans-serif;--dw:800;--dw2:760;--dt:-.035em}
:root[data-font="deportiva"]{--f-d:"Archivo",system-ui,sans-serif;--dw:800;--dw2:760;--dt:-.004em;--dtt:uppercase;--dst:74%}
:root{--fz:1}:root[data-fz="1"]{--fz:1.12}:root[data-fz="2"]{--fz:1.25}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(1000px 560px at 110% -12%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 60%),radial-gradient(760px 480px at -16% 0%,color-mix(in srgb,var(--accent-2) 7%,transparent),transparent 58%),var(--bg);background-repeat:no-repeat;color:var(--ink);font:calc(16px*var(--fz))/1.5 var(--f-b);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-optical-sizing:auto;-webkit-tap-highlight-color:transparent;padding-block:0 calc(var(--navh) + 22px)}
body.timing{padding-block:0 calc(var(--navh) + 112px)}
.in{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:inherit}p{margin:0}a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
nav.tabs,.btn,.seg,.chk,.ibtn,.meso,.daypick,.fc,.mp,.chipb,.sbtn,.thumb,.var-th,.wkd,.opt,.stp-b{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.disp{font-family:var(--f-d);font-weight:var(--dw);letter-spacing:var(--dt);font-stretch:var(--dst)}
.mono,.num{font-family:var(--f-b);font-variant-numeric:tabular-nums}
.small{font-size:calc(14px*var(--fz))}.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 calc(13.5px*var(--fz))/1.3 var(--f-b);color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inl svg.i{width:16px;height:16px;vertical-align:-3px}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid transparent;transition:border-color .2s}
html.scrolled .top{border-bottom-color:var(--edge)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:var(--dw) calc(24px*var(--fz))/1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);color:var(--accent)}
.brand span{font:600 calc(14px*var(--fz)) var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span.named{color:var(--ink-2)}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 calc(13px*var(--fz)) var(--f-b);padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.ibtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;padding:0;box-shadow:var(--hi),var(--sh1);transition:transform .12s var(--ease),background .15s}
.ibtn:active{transform:scale(.94)}
.ibtn.sm{width:34px;height:34px;border-radius:11px}.ibtn.sm svg.i{width:17px;height:17px}
.ibtn:disabled{opacity:.4;cursor:default}
.ibtn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--accent)}.dot.err{background:var(--bad)}.dot.off{background:var(--muted)}
.ibtn.av{border-radius:50%;width:44px;height:44px}
.ibtn.av.has{background:var(--hero);border:0;color:var(--hero-ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb,var(--fx) 75%,transparent),0 8px 18px -8px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.av-i{font:var(--dw) calc(19px*var(--fz))/1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}

/* estructura */
main{display:flex;flex-direction:column;gap:20px;padding-block:14px 8px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:76px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:6px}
.sec-h h2{display:flex;align-items:center;gap:10px;font:var(--dw) calc(32px*var(--fz))/1.08 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);text-transform:var(--dtt);color:var(--ink)}
.sec-h .eyebrow{padding-bottom:4px}
.sec-h.sm h2{font-size:calc(23px*var(--fz))}
.h-ic{display:none}
.card{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--hi),var(--sh2)}
b.ttl{display:flex;align-items:center;gap:8px;font:650 calc(16px*var(--fz))/1.25 var(--f-b);margin-bottom:6px}
b.ttl svg.i{color:var(--accent);width:19px;height:19px}
.lbl,.field label{font-size:calc(14px*var(--fz));color:var(--ink-2);font-weight:600}
.foot{text-align:center;padding:4px 0}

/* barra de pestañas */
nav.tabs{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30;max-width:560px;margin-inline:auto;border-radius:26px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--edge);box-shadow:var(--hi),var(--sh3)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;max-width:none}
nav.tabs button{--navfz:calc(11.5px*var(--fz));border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:20px;color:var(--muted);font-weight:600;font-family:var(--f-b);font-size:max(calc(10px*var(--fz)),min(var(--navfz),3.1vw));min-width:0;transition:color .2s,background .25s,transform .15s var(--ease)}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button[aria-current="page"]{color:var(--hero-ink);background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.18),transparent 60%),var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -8px color-mix(in srgb,var(--hero-a) 85%,transparent)}
nav.tabs button[aria-current="page"] svg{color:var(--fx)}

/* temporizador de descanso */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--navh) + 6px);z-index:29;pointer-events:none}
.t-box{pointer-events:auto;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.12),transparent 55%),var(--hero);color:var(--hero-ink);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh3);animation:rise .35s var(--ease) both}
.t-box::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.14;mix-blend-mode:overlay;pointer-events:none}
.t-time{font:var(--dw) calc(32px*var(--fz))/1 var(--f-d);font-stretch:var(--dst);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--fx)}
.t-lab{font-size:calc(14px*var(--fz));opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bar{grid-column:1/-1;height:5px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--foil);box-shadow:0 0 10px color-mix(in srgb,var(--fx) 70%,transparent)}
.t-b{grid-column:1/-1;display:flex;gap:6px;position:relative;z-index:1}
.t-b button{flex:1;min-height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);color:var(--hero-ink);font:600 calc(13.5px*var(--fz)) var(--f-b)}
.t-b button:active{background:rgba(255,255,255,.18)}

/* aviso de versión nueva, notificaciones y confeti */
.upd{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:35;pointer-events:none}
.upd-box{pointer-events:auto;background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:calc(15px*var(--fz));font-weight:600;box-shadow:var(--sh3)}
.upd-box button{border:0;border-radius:12px;min-height:38px;padding:0 14px;background:var(--foil);color:var(--fx-ink);font:700 calc(14px*var(--fz)) var(--f-b)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 12px);z-index:85;background:color-mix(in srgb,var(--ink) 95%,transparent);color:var(--bg);padding:12px 16px;border-radius:16px;font:500 calc(14.5px*var(--fz))/1.35 var(--f-b);width:max-content;max-width:min(92vw,520px);box-shadow:var(--sh3);pointer-events:none;animation:toast .35s cubic-bezier(.2,.9,.3,1.25) both}
.toast.win{background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.14),transparent 55%),var(--hero);color:var(--hero-ink);padding-left:48px;font-weight:600}
.toast.win::before{content:"";position:absolute;left:13px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--foil);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
body.timing .toast{bottom:calc(var(--navh) + 124px)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* hoja inferior */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(14,4,8,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
.sheet.on .sh-back{opacity:1}
.sh-box{position:relative;width:min(680px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 12px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -24px 60px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(102%);transition:transform .34s var(--ease);outline:none}
.sheet.on .sh-box{transform:none}
.sh-grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
html.noscroll,html.noscroll body{overflow:hidden}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.sh-h .ibtn{flex:none}
.sh-tt{min-width:0}
.sh-h h2{font:var(--dw) calc(27px*var(--fz))/1.12 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-top:4px}
.sh-ttl{flex:1;min-width:0;align-self:center;font:var(--dw) calc(24px*var(--fz))/1.15 var(--f-d)!important;letter-spacing:var(--dt);font-stretch:var(--dst);margin:0!important}
#sh-body>.card,#sh-body>.col,#sh-body>.pals,#sh-body>.fold,#sh-body>.row,#sh-body>.ttip,#sh-body>.nchips,#sh-body>.phc,#sh-body>.pho1,#sh-body>.fonts,#sh-body>.glist2{margin-bottom:12px}
#sh-body>.col{gap:10px}

/* ventanitas ⓘ y menús */
.tipb{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;margin:-4px 0 -4px 4px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);vertical-align:middle;flex:none;cursor:pointer}
.tipb::after{content:"";position:absolute;inset:-10px}
.tipb svg.i{width:17px;height:17px}
.tipb:hover,.tipb[aria-expanded="true"]{color:var(--accent)}
.ficha .tipb,.sum .tipb{color:inherit;opacity:.85}
.pop{position:fixed;z-index:80;left:0;top:0;max-width:calc(100vw - 24px);padding:13px 15px;border-radius:18px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh3);font-size:calc(14.5px*var(--fz));line-height:1.45;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .16s,transform .18s var(--ease)}
.pop.on{opacity:1;transform:none}
.pop::before{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;margin-left:-6px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg)}
.pop[data-side="b"]::before{top:-7px;border-right:0;border-bottom:0}
.pop[data-side="t"]::before{bottom:-7px;border-left:0;border-top:0}
.pop-t{display:block;font:var(--dw2) calc(17px*var(--fz))/1.25 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-bottom:4px;color:var(--ink)}
.pop p{color:var(--ink-2)}
.pop .menu{position:relative;display:flex;flex-direction:column;margin:-6px -8px}
.pop .menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 10px;border:0;border-radius:12px;background:none;text-align:left;font:600 calc(15px*var(--fz)) var(--f-b);color:var(--ink)}
.pop .menu button svg.i{color:var(--accent)}
.pop .menu button:active,.pop .menu button:hover{background:var(--surface-2)}
.pop .menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 8px}
.pop-s{padding:8px 0 4px;border-top:1px solid var(--line-2)}.pop-t+.pop-s{border-top:0}
.pop-s>b{display:block;font-weight:700}
.pop-s ul{margin:4px 0 0;padding-left:16px;font-size:calc(14px*var(--fz));color:var(--ink-2)}

/* botones: táctiles, con luz arriba y hundimiento suave */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:650 calc(15px*var(--fz))/1.1 var(--f-b);text-decoration:none;box-shadow:var(--hi),var(--sh1);transition:transform .12s var(--ease),box-shadow .12s,background .15s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn svg.i{width:18px;height:18px}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 90%,#fff),var(--accent) 70%);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 0 rgba(0,0,0,.14),0 10px 22px -10px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn.gold,.sum .btn.fxb{background:var(--foil);border-color:transparent;color:var(--fx-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 10px 24px -12px rgba(0,0,0,.55)}
.btn.sm{min-height:38px;padding:0 13px;font-size:calc(14px*var(--fz));border-radius:12px}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.sq{width:46px;padding:0;flex:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2);box-shadow:var(--hi);transition:transform .12s var(--ease),background .15s}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px -8px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.seg.sm button{min-height:34px;padding:0 12px;font-size:calc(13px*var(--fz))}
.seg.big button{min-height:50px;padding:0 18px;font-size:calc(15.5px*var(--fz))}

/* chips, píldoras y etiquetas */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:8px 13px;font:550 calc(14px*var(--fz)) var(--f-b)}
.chipb:active{background:var(--accent-soft)}
.chipb svg.i{width:16px;height:16px;color:var(--accent)}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chipb[aria-pressed="true"] svg.i{color:inherit}
.chip2{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font:600 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip2 svg.i{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 calc(12px*var(--fz))/1.3 var(--f-b);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.neu{background:var(--surface-2);color:var(--ink-2)}
.pill.new{background:var(--foil);color:var(--fx-ink);box-shadow:0 3px 8px -3px rgba(0,0,0,.35);font-size:calc(11.5px*var(--fz))}
.pill.sug{background:var(--foil);color:var(--fx-ink);font-size:calc(11px*var(--fz))}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--edge);font-size:calc(13.5px*var(--fz));color:var(--ink-2)}
.nchip svg.i{width:16px;height:16px;color:var(--accent)}
.nchip b{font:700 calc(14px*var(--fz)) var(--f-b);color:var(--ink);font-variant-numeric:tabular-nums}
.nchip .tipb{margin:-4px -4px -4px 0}
.card .nchips .nchip{background:var(--surface-2);border-color:transparent}
.key{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fz));color:var(--ink-2)}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key i.ln{height:3px;width:16px;border-radius:2px}.key i.dash{height:0;width:16px;border-top:2px dashed var(--ink-2);border-radius:0}.key i.dot{border-radius:50%}.key i.tgt{width:3px;height:12px;border-radius:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pt);margin-right:6px;vertical-align:1px;flex:none}

/* campos */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field input,.field select,.field textarea{height:50px;border:1px solid var(--line);border-radius:15px;background:var(--surface);padding:0 14px;font:calc(16px*var(--fz)) var(--f-b);width:100%;min-width:0;box-shadow:var(--well);transition:border-color .15s,box-shadow .15s}
.field textarea{height:auto;min-height:76px;padding:12px 14px;resize:vertical;line-height:1.45}
.field small{font-size:calc(13px*var(--fz));color:var(--muted)}
.field input:focus,.field select:focus,.field textarea:focus,.stp-c input:focus,.setx-f select:focus,.srch input:focus{outline:none;border-color:var(--accent);box-shadow:var(--well),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.field small.err,.err{color:var(--bad);font-size:calc(13.5px*var(--fz));font-weight:550}
.wform{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.fields.m5{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

/* plegables y consejos de un solo uso */
.fold{border:1px solid var(--edge);border-radius:var(--r);background:var(--surface);box-shadow:var(--hi),var(--sh1);min-width:0}
.fold-h{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:10px 16px;border:0;background:none;color:var(--ink);text-align:left;border-radius:inherit}
.fold-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fold-ic svg.i{width:19px;height:19px}
.fold-t{flex:1;min-width:0;display:flex;flex-direction:column}
.fold-t b{font:650 calc(16px*var(--fz))/1.25 var(--f-b)}
.fold-s{font-size:calc(13.5px*var(--fz));color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:9px;height:9px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);color:var(--muted);margin:0 4px 0 2px}
.fold-h .chev{transform:rotate(45deg);margin-top:-5px;transition:transform .25s var(--ease),margin .25s}
.fold.open>.fold-h .chev{transform:rotate(225deg);margin-top:4px}
.fold-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.fold.open>.fold-b{grid-template-rows:1fr}
.fold-i{min-height:0;overflow:hidden;padding:0 16px;visibility:hidden;transition:visibility 0s linear .28s}
.fold-i::after{content:"";display:block;height:16px}
.fold.open>.fold-b>.fold-i{visibility:visible;transition:none}
.fold.flat{border:0;border-top:1px solid var(--line-2);border-radius:0 0 var(--r) var(--r);background:none;box-shadow:none;margin:14px -16px -16px}
.fold.mini{border:0;background:none;box-shadow:none}
.fold.mini>.fold-h{min-height:34px;padding:2px 0;gap:8px;width:auto}.fold.mini .fold-t b{font:600 calc(14px*var(--fz)) var(--f-b)}
.fold.mini .fold-i{padding:0}.fold.mini .fold-i::after{height:4px}
.fold.li{border:0;border-top:1px solid var(--line-2);border-radius:0;background:none;box-shadow:none}
.fold.li>.fold-h{min-height:52px;padding:6px 16px}.fold.li .fold-t b{font:600 calc(15.5px*var(--fz)) var(--f-b)}
.fold.li .fold-i::after{height:12px}
.ttip{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 13px;border-radius:16px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 35%,var(--line));font-size:calc(14.5px*var(--fz));color:var(--ink-2);animation:rise .35s var(--ease) both}
.ttip-i{color:var(--accent-2);display:grid;flex:none}.ttip-t{flex:1;min-width:0}.ttip b{color:var(--ink)}
.ttip.out{animation:tipout .22s ease-in both}

/* listas, tablas, notas y vacíos */
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:calc(15px*var(--fz))}
.steps.small{font-size:calc(14px*var(--fz));color:var(--ink-2)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:calc(15px*var(--fz))}
.bul li::marker{color:var(--accent-2)}
.note{border-radius:var(--r);padding:13px 15px;background:var(--surface);border:1px solid var(--line);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);font-size:calc(15px*var(--fz))}
.dl li:first-child{border-top:0}
.dl li>span:first-child{min-width:0}
.dl li .mono{font-size:calc(14px*var(--fz));color:var(--ink-2);white-space:nowrap}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:calc(14.5px*var(--fz))}
.tbl th{font:600 calc(12.5px*var(--fz)) var(--f-b);color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);font-size:calc(15px*var(--fz))}
.hist li:first-child{border-top:0}
.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:calc(14.5px*var(--fz));border:1px dashed var(--line);border-radius:16px}
.cout{white-space:pre-wrap;font-size:calc(15px*var(--fz));line-height:1.55;background:var(--surface-2);border-radius:14px;padding:11px 13px}
.cout:empty{display:none}

/* números destacados */
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0}
.hero b{font:var(--dw) calc(56px*var(--fz))/1 var(--f-d);letter-spacing:-.02em;font-stretch:var(--dst);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.hero span{font-size:calc(15px*var(--fz));color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--edge);border-radius:20px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:var(--hi),var(--sh1)}
.stat .l{display:inline-flex;align-items:center;font-size:calc(13.5px*var(--fz));color:var(--muted)}
.stat .v{font:var(--dw) calc(27px*var(--fz))/1.15 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);font-variant-numeric:lining-nums}
.stat .v .mono{font-family:inherit}
.stat .v .small{font:500 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.stat .d{font-size:calc(13.5px*var(--fz));color:var(--ink-2)}
.approx{font-family:var(--f-b);font-weight:500;margin-right:1px}
.dlt{font-weight:700;color:var(--ink)}

/* gráficos */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{fill:var(--muted);font:calc(11.5px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .lbl{fill:var(--ink);font:700 calc(13px*var(--fz)) var(--f-b)}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 calc(12.5px*var(--fz))/1.4 var(--f-b);padding:7px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:2;box-shadow:var(--sh2);font-variant-numeric:tabular-nums}

/* paletas y letras */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;min-width:0;box-shadow:var(--sh1)}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent),var(--sh2)}
.pal-prev{position:relative;overflow:hidden;height:66px;border-radius:13px;background:var(--hero);display:flex;align-items:flex-end;gap:6px;padding:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.pal-prev::before{content:"";position:absolute;inset:5px;border-radius:9px;border:1px dashed color-mix(in srgb,var(--fx) 45%,transparent)}
.pal-prev i{position:relative;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 2px 4px rgba(0,0,0,.3)}
.pal-name{display:block;font:var(--dw2) calc(17px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);color:var(--accent)}
.pal-sub{display:block;font-size:calc(13px*var(--fz));color:var(--muted);margin-top:2px}
.pal .ok{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pal .ok svg.i{width:15px;height:15px;stroke-width:2.4}

/* Hoy · tu semana */
.wk{display:flex;flex-direction:column;gap:10px}
.wk-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-h>b{font:var(--dw) calc(23px*var(--fz))/1.1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-right:auto}
.wk-s{font-size:calc(14px*var(--fz));color:var(--ink-2)}.wk-s b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wk-st{display:inline-flex;align-items:center;gap:4px;font:650 calc(14px*var(--fz)) var(--f-b);color:var(--accent-2)}
.wk-st svg.i{width:17px;height:17px}
.wk-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wkd i{font:600 calc(12px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted)}
.wkd b{position:relative;display:grid;place-items:center;width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;font:650 calc(15px*var(--fz)) var(--f-b);color:var(--ink-2);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--edge)}
.wkd.plan b{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent}
.wkd.rest b{background:transparent;border-color:transparent;color:var(--muted)}
.wkd.done b{background:var(--hero);color:var(--hero-ink);border:0;box-shadow:0 6px 14px -8px color-mix(in srgb,var(--hero-a) 90%,transparent)}
.wkd.done b::after{content:"";position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;background:var(--foil) ;box-shadow:0 0 0 2px var(--bg)}
.wkd.today i{color:var(--accent);font-weight:800}
.wkd.today b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.wkd.today.done b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--fx) 80%,var(--accent))}

/* Hoy · ficha de la sesión: cuero guindo con costura dorada */
.ficha{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-xl);color:var(--hero-ink);background:radial-gradient(130% 110% at 100% 0%,color-mix(in srgb,var(--hero-ink) 13%,transparent),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(0,0,0,.28),transparent 62%),var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.2),var(--sh3)}
.ficha::before{content:"";position:absolute;inset:7px;border-radius:calc(var(--r-xl) - 7px);border:1.5px dashed color-mix(in srgb,var(--fx) 40%,transparent);pointer-events:none;z-index:1}
.ficha::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.16;mix-blend-mode:overlay;pointer-events:none;z-index:-1}
.f-body{position:relative;z-index:2;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.f-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.f-tt{min-width:0;display:flex;flex-direction:column;gap:2px}
.f-hi{font:500 calc(15px*var(--fz))/1.3 var(--f-b);opacity:.9}.f-hi b{font-weight:750}
.f-name{font:var(--dw) clamp(calc(36px*var(--fz)),10.4vw,54px)/1.02 var(--f-d);letter-spacing:-.02em;font-stretch:var(--dst);text-transform:var(--dtt);margin-top:4px;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.28)}
.f-mus{font-size:calc(15px*var(--fz));opacity:.88;margin-top:6px;max-width:30ch}
.f-map{display:flex;gap:2px;align-items:flex-end;margin:-2px -4px 0 0}
.f-map svg{width:56px;height:auto;display:block}
.f-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:12px 4px;border-block:1px solid rgba(255,255,255,.14)}
.f-kpi span{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0 10px;font-size:calc(13px*var(--fz));opacity:.95;border-left:1px solid rgba(255,255,255,.14)}
.f-kpi span:first-child{border-left:0;padding-left:2px}
.f-kpi b{font:var(--dw) calc(28px*var(--fz))/1 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);color:var(--fx);font-variant-numeric:lining-nums}
.f-mot{font-size:calc(15px*var(--fz));line-height:1.45;opacity:.94;max-width:52ch}
.f-meta{font-size:calc(15px*var(--fz))}
.f-eye{display:flex;align-items:center;font-size:calc(13.5px*var(--fz));opacity:.8}
.f-prog{display:flex;align-items:center;gap:10px;font:600 calc(13.5px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}
.f-prog .meter{flex:1}
.meter{height:8px;border-radius:999px;background:rgba(0,0,0,.24);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);overflow:hidden}
.meter i{display:block;height:100%;background:var(--foil);border-radius:999px;transition:width .5s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--fx) 60%,transparent)}
.f-act{gap:8px}
.f-act .btn{white-space:nowrap}
.f-act .btn.pri,.f-act .btn.gold{flex:1 1 auto}
.f-act.live{flex-wrap:nowrap}
.ficha .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.26);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ficha .btn.pri,.ficha .btn.gold{background:var(--foil);border-color:transparent;color:var(--fx-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12),0 12px 24px -12px rgba(0,0,0,.6)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.26);background:transparent;color:var(--hero-ink);font:600 calc(14px*var(--fz)) var(--f-b)}
.daypick button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-a)}
main.enter .ficha .f-name{animation:inkin .8s var(--ease) both}

/* anillo de progreso */
.ring{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:color-mix(in srgb,var(--accent) 14%,transparent);stroke-width:6}
.ring .rv{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .6s var(--ease)}
.ring span{position:relative;display:flex;flex-direction:column;line-height:1}
.ring b{font:var(--dw) calc(16px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.ring i{font:600 calc(9.5px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted);margin-top:3px;max-width:52px}
.ring.big{width:82px;height:82px}.ring.big b{font-size:calc(19px*var(--fz))}

/* Hoy · check-in: cómo llegas */
.ci{display:flex;flex-direction:column;gap:12px}
.ci-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ci-h b{font:var(--dw2) calc(20px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ci-h span{font-size:calc(13.5px*var(--fz));color:var(--muted)}
.ci-q{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center}
.ci-q>span{font:600 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.ci-q .seg{flex-wrap:nowrap;gap:5px}
.ci-q .seg button{flex:1 1 0;min-width:0;padding:0 6px;white-space:nowrap}
.ci-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ci-r p{font-size:calc(14.5px*var(--fz));color:var(--ink-2);margin-top:2px}
.ci-r b{font:var(--dw2) calc(19px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.gauge{position:relative;width:62px;height:62px;display:grid;place-items:center}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.gauge .rt{fill:none;stroke:var(--surface-2);stroke-width:7}
.gauge .rv{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--gc,var(--accent));transition:stroke-dasharray .6s var(--ease)}
.gauge b{position:relative;font:var(--dw) calc(20px*var(--fz)) var(--f-d)!important;font-stretch:var(--dst)}
.ci.lo{--gc:var(--warn)}.ci.mid{--gc:var(--accent-2)}.ci.hi{--gc:var(--good)}
.ci .row{margin-top:2px}

/* Hoy · tarjeta del ejercicio actual */
.exh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.exh h2{font:var(--dw) calc(23px*var(--fz))/1.1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.exh span{font-size:calc(14px*var(--fz));color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 74px)}
.ex.open{box-shadow:var(--hi),0 0 0 1.5px color-mix(in srgb,var(--accent) 32%,transparent),var(--sh3)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 14px 10px 16px}
.ex-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 calc(14px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pt) 70%,transparent)}
.ex.done .ex-n{background:var(--good);color:#fff;box-shadow:none}
.ex-n svg.i{width:17px;height:17px;stroke-width:2.6}
.ex-tt{min-width:0}
.ex-h h3{font:var(--dw2) calc(22px*var(--fz))/1.15 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ex-m{font-size:calc(14px*var(--fz));color:var(--muted);margin-top:4px}
.ex-note{display:flex;align-items:flex-start;gap:7px;margin:2px 14px 0 16px;padding:8px 11px;border-radius:12px;background:color-mix(in srgb,var(--accent-2) 10%,var(--surface));font-size:calc(14px*var(--fz));color:var(--ink-2)}
.ex-note svg.i{width:16px;height:16px;color:var(--accent-2);margin-top:2px}
.thumb,.var-th{position:relative;display:block;width:92px;height:78px;padding:0;border-radius:18px;border:1px solid var(--edge);background:radial-gradient(120% 100% at 50% 0%,var(--surface),var(--surface-2) 85%);box-shadow:var(--well);overflow:hidden;flex:none;transition:transform .15s var(--ease)}
.thumb:active,.var-th:active{transform:scale(.95)}
.th-svg,.th-svg svg{display:block;width:100%;height:100%}
.th-play{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px -2px rgba(0,0,0,.4)}
.th-play svg.i{width:12px;height:12px;margin-left:1px}
.scheme{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 0 16px}
.scheme .more{margin-left:auto}
.hint{margin:12px 14px 0 16px;padding:11px 13px;border-radius:15px;background:var(--surface-2);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.hint .hw{font:var(--dw) calc(21px*var(--fz))/1.15 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);color:var(--ink);font-variant-numeric:lining-nums}
.hint .hl{flex-basis:100%;font-size:calc(13px*var(--fz));color:var(--muted)}
.hint.up{background:var(--good-soft)}.hint.up .hw{color:var(--good)}
.hint.down{background:var(--warn-soft)}.hint.down .hw{color:var(--warn)}
.warm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:9px 14px 0 16px;font-size:calc(14px*var(--fz));color:var(--ink-2)}
.warm .mono{font-size:calc(13.5px*var(--fz))}
.panel{margin:10px 14px 0 16px;padding:11px 13px;border-radius:15px;background:var(--surface-2);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.plates{display:flex;align-items:center;gap:2px;min-height:70px;overflow-x:auto}
.plates .bar{flex:none;width:36px;height:8px;background:var(--p1);border-radius:2px}
.plates .colr{flex:none;width:6px;height:24px;background:var(--p1);border-radius:2px;margin-right:2px}
.plates .sleeve{flex:none;width:40px;height:12px;background:var(--p1);border-radius:0 3px 3px 0}
.pl{flex:none;display:block;border-radius:4px;height:var(--h);width:var(--w);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.25),inset -2px 0 0 rgba(0,0,0,.18)}
.p25{background:var(--p25)}.p20{background:var(--p20)}.p15{background:var(--p15)}.p10{background:var(--p10)}.p5{background:var(--p5)}.p2{background:var(--p2)}.p1{background:var(--p1)}

/* series: editor con − / + y filas hechas */
.sets{padding:12px 14px 16px 16px;display:flex;flex-direction:column;gap:7px}
.setx{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;background:color-mix(in srgb,var(--accent) 4%,var(--surface));border:1.5px solid color-mix(in srgb,var(--accent) 24%,var(--line))}
.setx.next{animation:rise .35s var(--ease) both}
.setx-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.setx-h>b{font:var(--dw2) calc(18px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}.setx-h>b .muted{font:500 calc(14px*var(--fz)) var(--f-b)}
.setx-h .chipb{padding:7px 12px;font-size:calc(13.5px*var(--fz))}
.setx-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-l{font:600 calc(13px*var(--fz)) var(--f-b);color:var(--muted);text-align:center}
.stp-c{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:6px;align-items:center}
.stp-c input,.setx-f select{width:100%;min-width:0;height:52px;border:1px solid var(--line);border-radius:15px;background:var(--surface);font:700 calc(22px*var(--fz)) var(--f-b);text-align:center;text-align-last:center;padding:0 4px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;box-shadow:var(--well);transition:border-color .15s,box-shadow .15s}
.stp-c input::placeholder{font-size:calc(15px*var(--fz));font-weight:600;color:color-mix(in srgb,var(--muted) 80%,transparent)}
.stp-c input.bump{animation:bump .25s var(--ease)}
.stp-b{height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 calc(24px*var(--fz))/1 var(--f-b);color:var(--ink);padding:0;box-shadow:var(--hi),var(--sh1);transition:transform .1s var(--ease)}
.stp-b:active{transform:scale(.9);background:var(--surface-2)}
.setx-f{display:grid;grid-template-columns:auto 74px minmax(0,1fr);gap:8px;align-items:center}
.rirl{display:inline-flex;align-items:center;font:650 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.setx-f select{height:52px;font-size:calc(18px*var(--fz))}
.chk{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0;box-shadow:var(--hi),var(--sh1);transition:transform .12s var(--ease)}
.chk:active{transform:scale(.95)}
.chk svg.i{stroke-width:2.6}
.chk.big{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;font:700 calc(16px*var(--fz)) var(--f-b);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 90%,#fff),var(--accent) 70%);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 0 rgba(0,0,0,.14),0 10px 20px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) auto 44px;gap:8px;align-items:center;min-height:48px;padding:4px 4px 4px 6px;border-radius:15px}
.set .n{font:650 calc(14px*var(--fz)) var(--f-b);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set .sv{font:650 calc(16px*var(--fz)) var(--f-b);color:var(--ink);font-variant-numeric:tabular-nums}
.set .sq{font:550 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2)}
.set.done{background:var(--good-soft)}
.set.done .chk{height:38px;background:var(--good);border-color:transparent;color:#fff;box-shadow:none}
.set.done.just{animation:flashbg 1.1s ease-out}.set.done.just .chk{animation:pop .55s var(--spring)}
.set.up{grid-template-columns:26px minmax(0,1fr) auto;width:100%;border:1px dashed var(--line);background:transparent;text-align:left;color:var(--ink-2)}
.set.up .sv{color:var(--ink-2);font-weight:500}
.set.up:active{background:var(--surface-2)}

/* filas plegadas (ejercicios que no son el actual) */
.exr{background:color-mix(in srgb,var(--surface) 70%,transparent);box-shadow:none}
.exr-b{display:grid;grid-template-columns:auto 50px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 14px 9px 14px;border:0;background:none;color:var(--ink);text-align:left}
.exr-b:active{background:var(--surface-2)}
.exr-th{width:50px;height:42px;border-radius:12px;background:radial-gradient(120% 100% at 50% 0%,var(--surface),var(--surface-2) 85%);box-shadow:var(--well);overflow:hidden}
.exr-t{display:flex;flex-direction:column;min-width:0}
.exr-t b{font:650 calc(15.5px*var(--fz))/1.25 var(--f-b);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exr-t span{font:500 calc(13.5px*var(--fz)) var(--f-b);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.exr .ex-n{width:28px;height:28px;font-size:calc(13px*var(--fz))}
.exr.done .exr-t b{color:var(--ink-2)}.exr.done .exr-t span{color:var(--good)}
.addx{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);border:1.5px dashed color-mix(in srgb,var(--accent) 35%,var(--line));background:transparent;color:var(--accent);font:650 calc(15px*var(--fz)) var(--f-b)}
.addx:active{background:var(--accent-soft)}
.addx svg.i{width:19px;height:19px}

/* fin de la sesión */
.done-all{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.done-all>div{flex:1;min-width:150px;display:flex;flex-direction:column}
.done-all b{font:var(--dw2) calc(19px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.card.sum{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(130% 120% at 100% 0%,rgba(255,255,255,.14),transparent 55%),var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),var(--sh3);padding:20px}
.card.sum::before{content:"";position:absolute;inset:7px;border-radius:calc(var(--r) - 6px);border:1.5px dashed color-mix(in srgb,var(--fx) 40%,transparent);pointer-events:none}
.card.sum::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.15;mix-blend-mode:overlay;pointer-events:none;z-index:-1}
.sum .eyebrow{color:color-mix(in srgb,var(--hero-ink) 82%,transparent)}
.sumh{font:var(--dw) calc(32px*var(--fz))/1.05 var(--f-d);letter-spacing:-.015em;font-stretch:var(--dst);text-transform:var(--dtt);margin:4px 0}
.sum-top{position:relative;display:flex;gap:14px;align-items:center}
.sum-medal{display:grid;place-items:center;border-radius:50%;flex:none;width:60px;height:60px;color:var(--fx-ink);background:var(--foil);box-shadow:inset 0 -3px 6px rgba(0,0,0,.22),inset 0 2px 3px rgba(255,255,255,.6),0 0 0 4px rgba(255,255,255,.12),0 10px 22px -8px rgba(0,0,0,.5);animation:medal 1s var(--ease) both}
.sum-medal svg.i{width:28px;height:28px}
.sum-medal.sm{width:46px;height:46px;animation:none}.sum-medal.sm svg.i{width:22px;height:22px}
.sum-stats{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin:16px 0 8px}
.sum-stats span{display:flex;flex-direction:column;gap:3px;font-size:calc(13px*var(--fz));padding:11px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.sum-stats b{font:var(--dw) calc(26px*var(--fz))/1 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);color:var(--fx);font-variant-numeric:lining-nums}
.sum .mono{color:var(--fx)}
.sum .bul{position:relative}
.sum-xp{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;font:650 calc(14.5px*var(--fz)) var(--f-b)}
.sum-xp .xpb{flex:1;height:8px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
.sum-xp .xpb i{display:block;height:100%;background:var(--foil);border-radius:9px}
.sum-badges{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sbadge{display:inline-flex;align-items:center;gap:9px;padding:6px 13px 6px 6px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.sbadge .medal{width:32px;height:32px}
.sbadge small{display:block;font:600 calc(11.5px*var(--fz)) var(--f-b);opacity:.82}
.sbadge b{font:var(--dw2) calc(15px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.sum-mot{position:relative;font-size:calc(15.5px*var(--fz));margin:10px 0 14px;opacity:.95}
.sum .row{position:relative}
.sum .btn{background:rgba(255,255,255,.08);color:var(--hero-ink);border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.sum .btn.ghost{background:transparent;box-shadow:none}

/* avisos: novedades e instalación */
.newc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:13px 13px 13px 15px;border-color:color-mix(in srgb,var(--accent-2) 40%,var(--line));background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 60%),var(--surface)}
.newc-t{flex:1 1 200px;font:600 calc(15px*var(--fz))/1.35 var(--f-b)}
.newc .row{flex-wrap:nowrap;margin-left:auto}
.inst{display:flex;flex-direction:column;gap:8px;padding:13px 15px}

/* pestañas internas */
.stabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:18px;background:color-mix(in srgb,var(--surface-2) 90%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--edge)}
.stabs button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 6px;border:0;border-radius:14px;background:none;color:var(--ink-2);font:600 calc(14.5px*var(--fz)) var(--f-b);min-width:0;white-space:nowrap}
.stabs button span{overflow:hidden;text-overflow:ellipsis}
.stabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--hi),0 2px 8px -3px rgba(40,10,20,.25)}

/* Plan · asistente de rutina */
.ai{display:flex;flex-direction:column;gap:12px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 55%),var(--surface);border-color:color-mix(in srgb,var(--accent-2) 30%,var(--edge))}
.ai-h{display:flex;gap:13px;align-items:center}
.ai-h b{display:block;font:var(--dw2) calc(20px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ai-h .small{display:block;margin-top:2px}
.ai-orb{position:relative;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--fx);background:var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -8px color-mix(in srgb,var(--hero-a) 85%,transparent);flex:none;animation:orb 5s ease-in-out infinite}
.ai-orb svg.i{width:23px;height:23px}
.ai-res{border-radius:16px;padding:13px 15px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1);animation:rise .35s var(--ease) both}
.ai-done{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--good-soft);color:var(--ink);font-size:calc(14.5px*var(--fz))}
.ai-done svg.i{color:var(--good)}.ai-done span{flex:1}

/* Plan · objetivo y prioridades */
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--hi),var(--sh1);min-width:0;transition:transform .14s var(--ease)}
.fc:active{transform:scale(.97)}
.fc-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.fc-t b{display:block;font:650 calc(15px*var(--fz))/1.2 var(--f-b)}
.fc-t span{display:block;font-size:calc(13px*var(--fz));line-height:1.3;color:var(--muted);margin-top:3px}
.fc[aria-pressed="true"]{background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.14),transparent 60%),var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -12px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.fc[aria-pressed="true"] .fc-ic{background:rgba(255,255,255,.12);color:var(--fx)}
.fc[aria-pressed="true"] .fc-t span{color:var(--hero-ink);opacity:.85}
.fc .sug{position:absolute;top:9px;right:9px}
.focus.cmp .fc{flex-direction:row;align-items:center;gap:10px;padding:10px}
.focus.cmp .fc-ic{width:34px;height:34px;border-radius:11px}.focus.cmp .fc-ic svg.i{width:18px;height:18px}
.focus.cmp .fc-t span{display:none}.focus.cmp .fc-t b{font-size:calc(14px*var(--fz))}
.focus.cmp .fc .sug{display:none}
.focus.cmp+small{margin-top:-4px}
.mpri{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:6px}
.mp{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;min-width:0;box-shadow:var(--hi);transition:transform .12s var(--ease)}
.mp:active{transform:scale(.96)}
.mp span{font:650 calc(14.5px*var(--fz))/1.2 var(--f-b)}
.mp i{font:600 calc(12px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted)}
.mp.p2{background:var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.mp.p2 i{color:var(--fx)}
.mp.p0{background:var(--surface-2);border-style:dashed;color:var(--ink-2);box-shadow:none}
.mp.own::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent-2)}

/* Plan · mesociclo, días y volumen */
.meso{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.meso button{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;color:var(--ink);box-shadow:var(--hi)}
.meso .iv{width:10px;height:36px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:5px;overflow:hidden;box-shadow:var(--well)}
.meso .iv i{display:block;width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent));border-radius:5px 5px 0 0}
.meso b{font:var(--dw) calc(17px*var(--fz))/1 var(--f-d);font-stretch:var(--dst)}
.meso span.t{font:550 calc(11px*var(--fz)) var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.meso button[aria-pressed="true"]{background:var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.meso button[aria-pressed="true"] span.t{color:inherit;opacity:.85}
.meso button[aria-pressed="true"] .iv{background:rgba(255,255,255,.18)}
.meso button[aria-pressed="true"] .iv i{background:var(--foil)}
.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.dchips::-webkit-scrollbar{display:none}
.dchips button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:120px;padding:11px 15px;border-radius:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;box-shadow:var(--hi);scroll-snap-align:start}
.dchips b{font:var(--dw2) calc(16px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);white-space:nowrap}
.dchips span{font:550 calc(12.5px*var(--fz)) var(--f-b);color:var(--muted)}
.dchips button[aria-selected="true"]{background:var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:0 8px 16px -10px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.dchips button[aria-selected="true"] span{color:inherit;opacity:.85}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.day-h h3{font:var(--dw2) calc(21px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.day-m{display:flex;align-items:center;gap:8px;flex:none}
.day.next{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.day>.row{margin-top:10px}
.day-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:6px}
.day-top .mmap-pair svg{width:46px}
.exl2s{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exl2{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:6px 10px 6px 6px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-align:left;overflow:hidden}
.exl2:active{background:var(--surface-2)}
.exl2-th{width:56px;height:46px;border-radius:12px;background:radial-gradient(120% 100% at 50% 0%,var(--surface),var(--surface-2) 85%);box-shadow:var(--well);overflow:hidden}
.exl2-t{display:flex;flex-direction:column;min-width:0}
.exl2-t b{font:650 calc(15px*var(--fz))/1.25 var(--f-b)}
.exl2-t>span{font-size:calc(13px*var(--fz));color:var(--muted)}
.exl2-t .mono{font-size:calc(13px*var(--fz))}
.vb{display:flex;flex-direction:column;gap:9px}
.vrow{display:grid;grid-template-columns:90px minmax(0,1fr) 60px;gap:8px;align-items:center;font-size:calc(14px*var(--fz))}
.vtrack{position:relative;height:16px;background:var(--surface-2);border-radius:0 7px 7px 0;box-shadow:var(--well)}
.vband{position:absolute;top:-3px;bottom:-3px;background:color-mix(in srgb,var(--good) 12%,transparent);border-inline:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.vplan{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--pt,var(--accent)) 24%,transparent);border-radius:0 7px 7px 0}
.vdone{position:absolute;left:0;top:3px;bottom:3px;background:var(--pt,var(--accent));border-radius:0 6px 6px 0}
.vtgt{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);opacity:.7}
.vval{font:600 calc(13px*var(--fz)) var(--f-b);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.why .bul{font-size:calc(15px*var(--fz))}

/* Nutrición · objetivo, anillos y registro de comidas */
.kc .hero{margin:4px 0 8px}
.mbar{display:flex;gap:2px;height:12px;margin:12px 0 10px;border-radius:7px;overflow:hidden;box-shadow:var(--well)}
.mbar i{display:block;height:100%}
.mleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mleg>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mleg b{font:var(--dw) calc(22px*var(--fz)) var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);font-variant-numeric:lining-nums}
.fl{display:flex;flex-direction:column;gap:14px}
.fl-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.fl-ring{position:relative;width:118px;height:118px;display:grid;place-items:center;text-align:center}
.fl-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fl-ring .rt{fill:none;stroke:var(--surface-2);stroke-width:9}
.fl-ring .rv{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .6s var(--ease)}
.fl-ring .rv.over{stroke:var(--warn)}
.fl-ring span{position:relative;display:flex;flex-direction:column;line-height:1.05}
.fl-ring b{font:var(--dw) calc(27px*var(--fz)) var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);font-variant-numeric:lining-nums}
.fl-ring i{font:550 calc(12px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted);margin-top:3px}
.fl-mac{display:flex;flex-direction:column;gap:9px;min-width:0}
.mac{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:baseline}
.mac>span:first-child{font:600 calc(13.5px*var(--fz)) var(--f-b);color:var(--ink-2)}
.mac>b{font:700 calc(14px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}.mac>b i{font-style:normal;font-weight:500;color:var(--muted)}
.mac .mb{grid-column:1/-1;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.mac .mb i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .5s var(--ease)}
.fl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fl-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.fl-list li:first-child{border-top:0}
.fl-n{display:flex;flex-direction:column;min-width:0}
.fl-n b{font:600 calc(15px*var(--fz))/1.25 var(--f-b)}
.fl-n span{font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 calc(18px*var(--fz))/1 var(--f-b);color:var(--ink);padding:0}
.qty button:active{background:var(--surface-2)}
.qty b{min-width:30px;text-align:center;font:700 calc(15px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}
.fl-q{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:calc(13.5px*var(--fz));color:var(--muted)}
.cnt{display:flex;flex-direction:column;gap:12px}
.cnt-r{display:flex;align-items:center;gap:12px}
.cnt-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--s1) 13%,var(--surface));color:var(--s1);flex:none}
.cnt-ic.a{background:color-mix(in srgb,var(--s3) 13%,var(--surface));color:var(--s3)}
.cnt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cnt-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cnt-l b{font:650 calc(15px*var(--fz)) var(--f-b)}
.cnt-l .mono{font-size:calc(14px*var(--fz));color:var(--ink-2)}
.cbar{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden;box-shadow:var(--well)}
.cbar i{display:block;height:100%;border-radius:9px;background:var(--s1);transition:width .4s var(--ease)}
.cbar.a i{background:var(--s3)}
.cnt-b{display:flex;gap:6px;flex-wrap:wrap;padding-left:54px}
.cnt-b .btn{flex:1 1 auto;min-width:58px}
.srch{position:relative;display:flex;align-items:center}
.srch svg.i{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.srch input{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 14px 0 44px;font:calc(16px*var(--fz)) var(--f-b);box-shadow:var(--well)}
.foods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.food:first-child{border-top:0}
.food b{display:block;font:600 calc(15px*var(--fz))/1.25 var(--f-b)}
.food span{font-size:calc(13px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.food .ibtn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.food.on .ibtn{background:var(--good);color:#fff}
.supp li{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:calc(14.5px*var(--fz))}
.supp li:first-child{border-top:0}
.supp b{font-weight:650}

/* Progreso · calendario, fotos, medallas y nivel */
.cal{display:flex;flex-direction:column;gap:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-h b{font:var(--dw2) calc(20px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ibtn.fwd svg{transform:rotate(180deg)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cw{font:600 calc(12px*var(--fz)) var(--f-b);color:var(--muted);padding:2px 0}
.cd{display:grid;place-items:center;width:100%;max-width:46px;aspect-ratio:1;margin:auto;border-radius:50%;font:600 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2);border:0;background:none;padding:0;font-variant-numeric:tabular-nums}

.cd.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:800}

.cd.on{background:var(--hero);color:var(--hero-ink);font-weight:750;box-shadow:0 5px 12px -6px color-mix(in srgb,var(--hero-a) 85%,transparent);cursor:pointer}
.cd.on.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--fx) 80%,var(--accent))}
.phog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pho{position:relative;aspect-ratio:3/4;padding:0;border:1px solid var(--edge);border-radius:16px;overflow:hidden;background:var(--surface-2);box-shadow:var(--sh1)}

.pho span{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 calc(12px*var(--fz)) var(--f-b)}
.pho1{margin:0}.pho1 img{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:20px;background:var(--surface-2)}
.phc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phc figure{margin:0;display:flex;flex-direction:column;gap:6px}
.phc img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:var(--surface-2)}
.phc figcaption{font:600 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2);text-align:center}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;overflow:hidden;isolation:isolate}
.lvl-b{position:relative;width:76px;height:76px;display:grid;place-items:center}

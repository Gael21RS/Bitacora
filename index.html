.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:radial-gradient(75% 55% at 50% 38%,color-mix(in srgb,var(--pri) 30%,var(--bg)),var(--bg) 72%);cursor:pointer;animation:spout .45s var(--ease) 2.05s forwards}

/* temporizador de descanso: cápsula negra tipo isla; al terminar suena hasta que lo detienes */

#sh-body>.card,#sh-body>.col,#sh-body>.pals,#sh-body>.fold,#sh-body>.row,#sh-body>.ttip,#sh-body>.nchips,#sh-body>.phc,#sh-body>.pho1,#sh-body>.fonts,#sh-body>.glist2,#sh-body>.srch,#sh-body>.chips,#sh-body>.edl{margin-bottom:12px}

/* ventanitas ⓘ y menús */

.ficha .tipb,.sum .tipb{color:inherit;opacity:.85}
.pop{position:fixed;z-index:80;left:0;top:0;max-width:calc(100vw - 24px);padding:13px 15px;border-radius:22px;background:var(--lens),var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);box-shadow:var(--glass-hl),var(--sh3);font-size:calc(14.5px*var(--fz));line-height:1.45;opacity:0;transform:translateY(6px) scale(.96);transform-origin:var(--ax,50%) 0;transition:opacity .18s,transform .4s var(--soft)}
.pop.on{opacity:1;transform:none}
.pop::before{display:none}
.pop-t{display:block;font:var(--dw2) calc(17px*var(--fz))/1.25 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-bottom:4px;color:var(--ink)}
.pop p{color:var(--ink-2)}
.pop .menu{position:relative;display:flex;flex-direction:column;margin:-6px -8px}
.pop .menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:14px;background:none;text-align:left;font:550 calc(15.5px*var(--fz)) var(--f-b);color:var(--ink)}
.pop .menu button svg.i{color:var(--accent)}
.pop .menu button:active,.pop .menu button:hover{background:var(--fill-3)}
.pop .menu hr{border:0;border-top:.5px solid var(--line);margin:4px 10px}
.pop-s{padding:8px 0 4px;border-top:.5px solid var(--line)}.pop-t+.pop-s{border-top:0}
.pop-s>b{display:block;font-weight:700}
.pop-s ul{margin:4px 0 0;padding-left:16px;font-size:calc(14px*var(--fz));color:var(--ink-2)}

/* botones: cápsulas; al tocar se iluminan desde el dedo y rebotan con resorte */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 19px;border-radius:999px;border:0;background:var(--fill-3);color:var(--ink);font:650 calc(15.5px*var(--fz))/1.1 var(--f-b);letter-spacing:-.01em;text-decoration:none;transition:transform .45s var(--spring),background .2s,box-shadow .2s}
.btn::after,.chk.big::after,.sbtn::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 62%);opacity:0;transition:opacity .45s}
.btn:active,.chk.big:active,.sbtn:active{transform:scale(.96);transition-duration:.12s}
.btn:active::after,.chk.big:active::after,.sbtn:active::after{opacity:1;transition-duration:.05s}
.btn svg.i{width:18px;height:18px}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 80%,#fff),var(--pri) 60%);color:var(--pri-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 20px -10px color-mix(in srgb,var(--pri) 90%,#000)}
.btn.gold,.sum .btn.fxb{background:linear-gradient(180deg,color-mix(in srgb,var(--fx) 78%,#fff),var(--fx) 60%);color:var(--fx-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 24px -12px rgba(0,0,0,.5)}
.btn.sm{min-height:38px;padding:0 15px;font-size:calc(14px*var(--fz))}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 90%,transparent)}
.btn.danger{color:var(--bad)}
.btn.sq{width:46px;padding:0;flex:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
/* control segmentado: riel gris y opción elegida en blanco */
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:22px;background:var(--fill-3);max-width:100%}
.seg button{flex:1 1 auto;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;font:600 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2);transition:background .25s,color .2s,box-shadow .25s,transform .4s var(--spring)}
.seg button:active{transform:scale(.95);transition-duration:.1s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.04),0 3px 8px -2px rgba(10,30,18,.18)}
.seg.sm button{min-height:32px;padding:0 12px;font-size:calc(13px*var(--fz))}
.seg.big button{min-height:46px;padding:0 18px;font-size:calc(15.5px*var(--fz))}

/* chips, píldoras y etiquetas */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill-3);color:var(--ink);border-radius:999px;padding:9px 14px;font:550 calc(14px*var(--fz)) var(--f-b);transition:background .2s,color .2s,transform .4s var(--spring)}
.chipb:active{transform:scale(.95);transition-duration:.1s}
.chipb svg.i{width:16px;height:16px;color:var(--accent)}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chipb[aria-pressed="true"] svg.i{color:inherit}
.chip2{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--fill-3);font:600 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip2 svg.i{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:5px;font:650 calc(12px*var(--fz))/1.3 var(--f-b);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.neu{background:var(--fill-3);color:var(--ink-2)}
.pill.new{background:var(--pri);color:var(--pri-ink);font-size:calc(11.5px*var(--fz))}
.pill.sug{background:var(--pri);color:var(--pri-ink);font-size:calc(11px*var(--fz))}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:999px;background:var(--fill-3);font-size:calc(13.5px*var(--fz));color:var(--ink-2)}
.nchip svg.i{width:16px;height:16px;color:var(--accent)}
.nchip b{font:700 calc(14px*var(--fz)) var(--f-b);color:var(--ink);font-variant-numeric:tabular-nums}
.nchip .tipb{margin:-4px -4px -4px 0}
.card .nchips .nchip{background:var(--fill-4)}
.key{display:inline-flex;align-items:center;gap:6px;font-size:calc(13px*var(--fz));color:var(--ink-2)}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key i.ln{height:3px;width:16px;border-radius:2px}.key i.dash{height:0;width:16px;border-top:2px dashed var(--ink-2);border-radius:0}.key i.dot{border-radius:50%}.key i.tgt{width:3px;height:12px;border-radius:2px;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pt);margin-right:6px;vertical-align:1px;flex:none}

/* campos: rellenos suaves, sin bordes */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field input,.field select,.field textarea{height:50px;border:0;border-radius:14px;background:var(--fill-4);padding:0 14px;font:calc(16px*var(--fz)) var(--f-b);width:100%;min-width:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 60%,transparent);transition:box-shadow .2s,background .2s}
.field textarea{height:auto;min-height:76px;padding:12px 14px;resize:vertical;line-height:1.45}
.field small{font-size:calc(13px*var(--fz));color:var(--muted)}
.field input:focus,.field select:focus,.field textarea:focus,.stp-c input:focus,.setx-f select:focus,.srch input:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--fill),0 0 0 4px color-mix(in srgb,var(--pri) 45%,transparent)}
.field small.err,.err{color:var(--bad);font-size:calc(13.5px*var(--fz));font-weight:550}
.wform{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.fields.m5{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

/* plegables y consejos de un solo uso */
.fold{border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1);min-width:0}
.fold-h{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:10px 16px;border:0;background:none;color:var(--ink);text-align:left;border-radius:inherit}
.fold-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fold-ic svg.i{width:19px;height:19px}
.fold-t{flex:1;min-width:0;display:flex;flex-direction:column}
.fold-t b{font:650 calc(16px*var(--fz))/1.25 var(--f-b)}
.fold-s{font-size:calc(13.5px*var(--fz));color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:9px;height:9px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);color:color-mix(in srgb,var(--muted) 75%,transparent);margin:0 4px 0 2px}
.fold-h .chev{transform:rotate(45deg);margin-top:-5px;transition:transform .45s var(--soft),margin .3s}
.fold.open>.fold-h .chev{transform:rotate(225deg);margin-top:4px}
.fold-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--sheet)}
.fold.open>.fold-b{grid-template-rows:1fr}
.fold-i{min-height:0;overflow:hidden;padding:0 16px;visibility:hidden;transition:visibility 0s linear .4s}
.fold-i::after{content:"";display:block;height:16px}
.fold.open>.fold-b>.fold-i{visibility:visible;transition:none}
.fold.flat{border:0;border-top:.5px solid var(--line);border-radius:0 0 var(--r) var(--r);background:none;box-shadow:none;margin:14px -16px -16px}
.fold.mini{border:0;background:none;box-shadow:none}
.fold.mini>.fold-h{min-height:34px;padding:2px 0;gap:8px;width:auto}.fold.mini .fold-t b{font:600 calc(14px*var(--fz)) var(--f-b)}
.fold.mini .fold-i{padding:0}.fold.mini .fold-i::after{height:4px}
.fold.li{border:0;border-top:.5px solid var(--line);border-radius:0;background:none;box-shadow:none}
.fold.li>.fold-h{min-height:52px;padding:6px 16px}.fold.li .fold-t b{font:600 calc(15.5px*var(--fz)) var(--f-b)}
.fold.li .fold-i::after{height:12px}
.ttip{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-radius:20px;background:var(--lens),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hl),0 6px 18px -10px rgba(10,30,18,.25);font-size:calc(14.5px*var(--fz));color:var(--ink-2);animation:rise .45s var(--soft) both}
.ttip-i{color:var(--accent);display:grid;flex:none}.ttip-t{flex:1;min-width:0}.ttip b{color:var(--ink)}
.ttip.out{animation:tipout .22s ease-in both}

/* listas, tablas, notas y vacíos */
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:calc(15px*var(--fz))}
.steps.small{font-size:calc(14px*var(--fz));color:var(--ink-2)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:calc(15px*var(--fz))}
.bul li::marker{color:var(--fill)}
.note{border-radius:var(--r);padding:14px 16px;background:var(--surface);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--ink);box-shadow:none}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:.5px solid var(--line);font-size:calc(15px*var(--fz))}
.dl li:first-child{border-top:0}
.dl li>span:first-child{min-width:0}
.dl li .mono{font-size:calc(14px*var(--fz));color:var(--ink-2);white-space:nowrap}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:calc(14.5px*var(--fz))}
.tbl th{font:600 calc(12.5px*var(--fz)) var(--f-b);color:var(--muted);text-align:left;padding:6px 8px;border-bottom:.5px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:.5px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:.5px solid var(--line);font-size:calc(15px*var(--fz))}
.hist li:first-child{border-top:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;text-align:center;color:var(--muted);font-size:calc(14.5px*var(--fz));border-radius:22px;background:var(--fill-4)}
.empty .masc,.pet .masc{width:60px;height:auto}
.pet{display:flex;align-items:center;gap:12px}.pet .masc{flex:none;width:50px}
.cout{white-space:pre-wrap;font-size:calc(15px*var(--fz));line-height:1.55;background:var(--fill-4);border-radius:16px;padding:11px 13px}
.cout:empty{display:none}

/* números destacados */
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0}
.hero b{font:var(--dw) calc(58px*var(--fz))/1 var(--f-d);letter-spacing:-.035em;font-stretch:var(--dst);font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.hero span{font-size:calc(15px*var(--fz));color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media (max-width:560px){.stats>:last-child:nth-child(odd){grid-column:1/-1}}
.stat{background:var(--surface);border-radius:22px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:var(--sh1)}
.stat .l{display:inline-flex;align-items:center;font-size:calc(13.5px*var(--fz));color:var(--muted)}
.stat .v{font:var(--dw) calc(28px*var(--fz))/1.12 var(--f-d);letter-spacing:-.025em;font-stretch:var(--dst);font-variant-numeric:lining-nums}
.stat .v .mono{font-family:inherit}
.stat .v .small{font:500 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.stat .d{font-size:calc(13.5px*var(--fz));color:var(--ink-2)}
.approx{font-family:var(--f-b);font-weight:500;margin-right:1px}
.dlt{font-weight:700;color:var(--ink)}

/* gráficos */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{fill:var(--muted);font:calc(11.5px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .lbl{fill:var(--ink);font:700 calc(13px*var(--fz)) var(--f-b)}
.tt{position:absolute;pointer-events:none;background:rgba(14,18,16,.9);color:#F3F7F4;font:500 calc(12.5px*var(--fz))/1.4 var(--f-b);padding:7px 10px;border-radius:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:2;box-shadow:var(--sh2);font-variant-numeric:tabular-nums}

/* paletas y letras */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal{position:relative;display:flex;flex-direction:column;gap:9px;padding:10px;border-radius:24px;border:0;background:var(--surface);color:var(--ink);text-align:left;min-width:0;box-shadow:var(--sh1),inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);transition:transform .45s var(--spring),box-shadow .25s}
.pal:active{transform:scale(.97);transition-duration:.1s}
.pal[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fill),0 0 0 4px color-mix(in srgb,var(--pri) 50%,transparent)}
.pal-prev{position:relative;overflow:hidden;height:66px;border-radius:16px;background:var(--hero);display:flex;align-items:flex-end;gap:6px;padding:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.pal-prev i{position:relative;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.pal-name{display:block;font:var(--dw2) calc(17px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);color:var(--ink)}
.pal-sub{display:block;font-size:calc(13px*var(--fz));color:var(--muted);margin-top:2px}
.pal .ok{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.pal .ok svg.i{width:15px;height:15px;stroke-width:2.4}

/* Hoy · tu semana */
.wk{display:flex;flex-direction:column;gap:10px}
.wk-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-h>b{font:var(--dw) calc(23px*var(--fz))/1.1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-right:auto}
.wk-s{font-size:calc(14px*var(--fz));color:var(--ink-2)}.wk-s b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.wk-st{display:inline-flex;align-items:center;gap:4px;font:680 calc(14px*var(--fz)) var(--f-b);color:var(--accent-2)}
.wk-st svg.i{width:17px;height:17px}
.wk-d{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wkd i{font:620 calc(12px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted)}
.wkd b{position:relative;display:grid;place-items:center;width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;font:600 calc(16px*var(--fz)) var(--f-b);color:var(--ink);font-variant-numeric:tabular-nums;background:var(--surface);box-shadow:var(--sh1);transition:transform .45s var(--spring)}
.wkd.plan b{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fill) 55%,transparent)}
.wkd.rest b{background:transparent;box-shadow:none;color:var(--muted)}
.wkd.done b{background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 75%,#fff),var(--pri) 65%);color:var(--pri-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px color-mix(in srgb,var(--pri) 90%,#000)}
.wkd.done b::after{content:"";position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--hero-a);box-shadow:0 0 0 2px var(--bg)}
.wkd.done b::before{content:"";position:absolute;right:1px;bottom:1px;width:10px;height:10px;z-index:1;background:var(--fx);-webkit-mask:var(--ck) center/contain no-repeat;mask:var(--ck) center/contain no-repeat}
.wkd.today i{color:var(--accent);font-weight:800}
.wkd.today b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fill)}

/* Hoy · ficha de la sesión: bosque con luz verde claro */
.ficha{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-xl);color:var(--hero-ink);background:radial-gradient(85% 70% at 100% 0%,color-mix(in srgb,var(--fx) 26%,transparent),transparent 62%),radial-gradient(70% 60% at 0% 100%,color-mix(in srgb,#5FD3C0 14%,transparent),transparent 65%),linear-gradient(160deg,var(--hero-b),var(--hero-a) 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.08),var(--sh3)}
.ficha::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 42%,transparent 54%);pointer-events:none;z-index:-1}
.f-body{position:relative;z-index:2;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.f-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.f-tt{min-width:0;display:flex;flex-direction:column;gap:2px}
.f-hi{font:500 calc(15px*var(--fz))/1.3 var(--f-b);opacity:.9}.f-hi b{font-weight:750}
.f-name{font:var(--dw) clamp(calc(38px*var(--fz)),10.8vw,56px)/1 var(--f-d);letter-spacing:-.035em;font-stretch:var(--dst);text-transform:var(--dtt);margin-top:4px;overflow-wrap:anywhere}
.f-mus{font-size:calc(15px*var(--fz));opacity:.88;margin-top:8px;max-width:30ch}
.f-map{display:flex;gap:2px;align-items:flex-end;margin:-2px -4px 0 0}
.f-map svg{width:56px;height:auto;display:block}
.f-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.f-kpi span{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:11px 12px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.06);font-size:calc(13px*var(--fz));opacity:.96}
.f-kpi b{font:var(--dw) calc(30px*var(--fz))/1 var(--f-d);letter-spacing:-.03em;font-stretch:var(--dst);color:var(--fx);font-variant-numeric:lining-nums tabular-nums}
.f-mot{font-size:calc(15px*var(--fz));line-height:1.45;opacity:.94;max-width:52ch}
.f-meta{font-size:calc(15px*var(--fz))}
.f-eye{display:flex;align-items:center;font-size:calc(13.5px*var(--fz));opacity:.8}
.f-prog{display:flex;align-items:center;gap:10px;font:620 calc(13.5px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums}
.f-prog .meter{flex:1}
.meter{height:6px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.meter i{display:block;height:100%;background:var(--fx);border-radius:999px;transition:width .5s var(--ease)}
.f-act{gap:8px}
.f-act .btn{white-space:nowrap}
.f-act .btn:not(.sq){flex:1 1 auto}.f-act .btn.pri,.f-act .btn.gold{flex:2 1 auto}
.f-act.live{flex-wrap:nowrap}
.ficha .btn{background:rgba(255,255,255,.12);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.1)}
.ficha .btn.pri,.ficha .btn.gold{background:linear-gradient(180deg,color-mix(in srgb,var(--fx) 75%,#fff),var(--fx) 60%);color:var(--fx-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 26px -12px rgba(0,0,0,.6)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);color:var(--hero-ink);font:600 calc(14px*var(--fz)) var(--f-b)}
.daypick button[aria-pressed="true"]{background:var(--fx);color:var(--fx-ink);border-color:transparent}
main.enter .ficha .f-name{animation:inkin .7s var(--ease) both}

/* anillo de progreso */
.ring{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:color-mix(in srgb,var(--fill) 16%,transparent);stroke-width:6}
.ring .rv{fill:none;stroke:var(--fill);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .6s var(--ease)}
.ring span{position:relative;display:flex;flex-direction:column;line-height:1}
.ring b{font:var(--dw) calc(16px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.ring i{font:620 calc(9.5px*var(--fz)) var(--f-b);font-style:normal;color:var(--muted);margin-top:3px;max-width:52px}
.ring.big{width:82px;height:82px}.ring.big b{font-size:calc(19px*var(--fz))}

/* Hoy · check-in: cómo llegas */
.ci{display:flex;flex-direction:column;gap:12px}
.ci-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ci-h b{font:var(--dw2) calc(20px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ci-h span{font-size:calc(13.5px*var(--fz));color:var(--muted)}
.ci-q{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center}
.ci-q>span{font:620 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.ci-q .seg{flex-wrap:nowrap;gap:5px}
.ci-q .seg button{flex:1 1 0;min-width:0;padding:0 6px;white-space:nowrap}
.ci-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ci-r p{font-size:calc(14.5px*var(--fz));color:var(--ink-2);margin-top:2px}
.ci-r b{font:var(--dw2) calc(19px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.gauge{position:relative;width:62px;height:62px;display:grid;place-items:center}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.gauge .rt{fill:none;stroke:var(--surface-2);stroke-width:7}
.gauge .rv{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--gc,var(--fill));transition:stroke-dasharray .6s var(--ease)}
.gauge b{position:relative;font:var(--dw) calc(20px*var(--fz)) var(--f-d)!important;font-stretch:var(--dst)}
.ci.lo{--gc:var(--warn)}.ci.mid{--gc:var(--accent-2)}.ci.hi{--gc:var(--good)}
.ci .row{margin-top:2px}

/* Hoy · tarjeta del ejercicio actual */
.exh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.exh h2{font:var(--dw) calc(23px*var(--fz))/1.1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.exh span{font-size:calc(14px*var(--fz));color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{position:relative;background:var(--surface);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 74px);transition:box-shadow .3s}
.ex.open{box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 80%,transparent),var(--sh2)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 14px 10px 16px}
.ex-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:650 calc(14px*var(--fz)) var(--f-b);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--fill-4);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pt) 70%,transparent)}
.ex.done .ex-n{background:var(--good);color:#fff;box-shadow:none}
.ex-n svg.i{width:17px;height:17px;stroke-width:2.6}
.ex-tt{min-width:0}
.ex-h h3{font:var(--dw2) calc(21px*var(--fz))/1.15 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ex-m{font-size:calc(14px*var(--fz));color:var(--muted);margin-top:4px}
.ex-note{display:flex;align-items:flex-start;gap:7px;margin:2px 14px 0 16px;padding:8px 11px;border-radius:14px;background:color-mix(in srgb,var(--accent-2) 10%,var(--surface));font-size:calc(14px*var(--fz));color:var(--ink-2)}
.ex-note svg.i{width:16px;height:16px;color:var(--accent-2);margin-top:2px}
.thumb,.var-th{position:relative;display:block;width:92px;height:78px;padding:0;border-radius:18px;border:0;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;flex:none;transition:transform .45s var(--spring)}
.thumb:active,.var-th:active{transform:scale(.95)}
.th-svg,.th-svg svg{display:block;width:100%;height:100%}
.th-play{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--accent);box-shadow:var(--glass-hl),0 3px 8px -3px rgba(0,0,0,.3)}
.th-play svg.i{width:12px;height:12px;margin-left:1px}
.scheme{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 14px 0 16px}
.scheme .more{margin-left:auto}
.hint{margin:12px 14px 0 16px;padding:11px 13px;border-radius:18px;background:var(--fill-4);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.hint .hw{font:var(--dw) calc(22px*var(--fz))/1.15 var(--f-d);letter-spacing:-.02em;font-stretch:var(--dst);color:var(--ink);font-variant-numeric:lining-nums}
.hint .hl{flex-basis:100%;font-size:calc(13px*var(--fz));color:var(--muted)}
.hint.up{background:var(--good-soft)}.hint.up .hw{color:var(--good)}
.hint.down{background:var(--warn-soft)}.hint.down .hw{color:var(--warn)}
.warm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:9px 14px 0 16px;font-size:calc(14px*var(--fz));color:var(--ink-2)}
.warm .mono{font-size:calc(13.5px*var(--fz))}
.panel{margin:10px 14px 0 16px;padding:11px 13px;border-radius:18px;background:var(--fill-4);font-size:calc(14.5px*var(--fz));color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.plates{display:flex;align-items:center;gap:2px;min-height:70px;overflow-x:auto}
.plates .bar{flex:none;width:36px;height:8px;background:var(--p1);border-radius:2px}
.plates .colr{flex:none;width:6px;height:24px;background:var(--p1);border-radius:2px;margin-right:2px}
.plates .sleeve{flex:none;width:40px;height:12px;background:var(--p1);border-radius:0 3px 3px 0}
.pl{flex:none;display:block;border-radius:4px;height:var(--h);width:var(--w);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.25),inset -2px 0 0 rgba(0,0,0,.18)}
.p25{background:var(--p25)}.p20{background:var(--p20)}.p15{background:var(--p15)}.p10{background:var(--p10)}.p5{background:var(--p5)}.p2{background:var(--p2)}.p1{background:var(--p1)}

/* series: editor con − / + y filas hechas */
.sets{padding:12px 14px 16px 16px;display:flex;flex-direction:column;gap:7px}
.setx{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:24px;background:color-mix(in srgb,var(--pri) 11%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pri) 75%,transparent)}
.setx.next{animation:rise .35s var(--ease) both}
.setx-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.setx-h>b{font:var(--dw2) calc(18px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}.setx-h>b .muted{font:500 calc(14px*var(--fz)) var(--f-b)}
.setx-h .chipb{padding:7px 12px;font-size:calc(13.5px*var(--fz))}
.setx-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-l{font:620 calc(13px*var(--fz)) var(--f-b);color:var(--muted);text-align:center}
.stp-c{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:6px;align-items:center}
.stp-c input,.setx-f select{width:100%;min-width:0;height:52px;border:0;border-radius:16px;background:var(--surface);font:650 calc(22px*var(--fz)) var(--f-b);text-align:center;text-align-last:center;padding:0 4px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 80%,transparent);transition:box-shadow .2s}
.stp-c input::placeholder{font-size:calc(15px*var(--fz));font-weight:600;color:color-mix(in srgb,var(--muted) 80%,transparent)}
.stp-c input.bump{animation:bump .25s var(--ease)}
.stp-b{height:52px;border-radius:50%;border:0;background:var(--surface);font:500 calc(24px*var(--fz))/1 var(--f-b);color:var(--ink);padding:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 80%,transparent),0 2px 6px -3px rgba(10,30,18,.15);transition:transform .4s var(--spring)}
.stp-b:active{transform:scale(.86);transition-duration:.08s;background:var(--fill-4)}
.setx-f{display:grid;grid-template-columns:auto 74px minmax(0,1fr);gap:8px;align-items:center}
.rirl{display:inline-flex;align-items:center;font:680 calc(14px*var(--fz)) var(--f-b);color:var(--ink-2)}
.setx-f select{height:52px;font-size:calc(18px*var(--fz))}
.chk{height:46px;border-radius:999px;border:0;background:var(--fill-3);display:grid;place-items:center;color:var(--muted);padding:0;transition:transform .4s var(--spring)}
.chk:active{transform:scale(.95)}
.chk svg.i{stroke-width:2.6}
.chk.big{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;font:700 calc(16px*var(--fz)) var(--f-b);background:linear-gradient(180deg,var(--hero-b),var(--hero-a));color:var(--fx);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 22px -12px color-mix(in srgb,var(--hero-a) 90%,transparent)}
.chk.big span{color:var(--hero-ink)}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) auto 44px;gap:8px;align-items:center;min-height:48px;padding:4px 4px 4px 6px;border-radius:18px}
.set .n{font:680 calc(14px*var(--fz)) var(--f-b);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set .sv{font:680 calc(16px*var(--fz)) var(--f-b);color:var(--ink);font-variant-numeric:tabular-nums}
.set .sq{font:580 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2)}
.set.done{background:var(--good-soft)}
.set.done .chk{height:38px;background:var(--good);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.set.done.just{animation:flashbg 1.1s ease-out}.set.done.just .chk{animation:pop .55s var(--spring)}
.set.up{grid-template-columns:26px minmax(0,1fr) auto;width:100%;border:0;background:var(--fill-4);text-align:left;color:var(--ink-2);transition:transform .4s var(--spring)}
.set.up .sv{color:var(--ink-2);font-weight:500}
.set.up:active{transform:scale(.98);transition-duration:.1s;background:var(--fill-3)}

/* filas plegadas (ejercicios que no son el actual) */
.exr{background:var(--surface);box-shadow:var(--sh1)}
.exr-b{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 14px;border:0;background:none;color:var(--ink);text-align:left}
.exr-b:active{background:var(--surface-2)}
.exr-th{width:52px;height:44px;border-radius:13px;background:linear-gradient(180deg,var(--surface),var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.exr-t{display:flex;flex-direction:column;min-width:0}
.exr-t b{font:680 calc(15.5px*var(--fz))/1.25 var(--f-b);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exr-t span{font:500 calc(13.5px*var(--fz)) var(--f-b);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.exr .ex-n{width:28px;height:28px;font-size:calc(13px*var(--fz))}
.exr.done .exr-t b{color:var(--ink-2)}.exr.done .exr-t span{color:var(--good)}
.addx{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:999px;border:0;background:var(--fill-3);color:var(--accent);font:650 calc(15px*var(--fz)) var(--f-b);transition:transform .45s var(--spring),background .2s}
.addx:active{transform:scale(.97);transition-duration:.1s;background:var(--fill-4)}
.addx svg.i{width:19px;height:19px}

/* fin de la sesión */
.done-all{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.done-all>div{flex:1;min-width:150px;display:flex;flex-direction:column}
.done-all b{font:var(--dw2) calc(19px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.card.sum{position:relative;overflow:visible;isolation:isolate;background:radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--fx) 24%,transparent),transparent 60%),linear-gradient(160deg,var(--hero-b),var(--hero-a) 70%);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--sh3);padding:20px;margin-top:34px}
.sum-pets{position:absolute;right:14px;top:-44px;display:flex;align-items:flex-end;pointer-events:none;animation:peek .7s var(--spring) .15s both}
.sum-pets .masc{width:104px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
@keyframes peek{from{opacity:0;transform:translateY(26px)}}
.sum .eyebrow{color:color-mix(in srgb,var(--hero-ink) 82%,transparent)}
.sumh{font:var(--dw) calc(32px*var(--fz))/1.04 var(--f-d);letter-spacing:-.03em;font-stretch:var(--dst);text-transform:var(--dtt);margin:4px 0}
.sum-top{position:relative;display:flex;gap:14px;align-items:center}
.sum-medal{display:grid;place-items:center;border-radius:50%;flex:none;width:60px;height:60px;color:var(--fx-ink);background:var(--fx);box-shadow:0 0 0 5px rgba(255,255,255,.1);animation:medal 1s var(--ease) both}
.sum-medal svg.i{width:28px;height:28px}
.sum-medal.sm{width:46px;height:46px;animation:none}.sum-medal.sm svg.i{width:22px;height:22px}
.sum-stats{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin:16px 0 8px}
.sum-stats span{display:flex;flex-direction:column;gap:3px;font-size:calc(13px*var(--fz));padding:11px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sum-stats b{font:var(--dw) calc(27px*var(--fz))/1 var(--f-d);letter-spacing:-.03em;font-stretch:var(--dst);color:var(--fx);font-variant-numeric:lining-nums}
.sum .mono{color:var(--fx)}
.sum .bul{position:relative}
.sum .bul li::marker{color:var(--fx)}
.sum-xp{position:relative;display:flex;align-items:center;gap:10px;margin:8px 0;font:680 calc(14.5px*var(--fz)) var(--f-b)}
.sum-xp .xpb{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.sum-xp .xpb i{display:block;height:100%;background:var(--fx);border-radius:9px}
.sum-badges{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sbadge{display:inline-flex;align-items:center;gap:9px;padding:6px 13px 6px 6px;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sbadge .medal{width:32px;height:32px}
.sbadge small{display:block;font:620 calc(11.5px*var(--fz)) var(--f-b);opacity:.82}
.sbadge b{font:var(--dw2) calc(15px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.sum-mot{position:relative;font-size:calc(15.5px*var(--fz));margin:10px 0 14px;opacity:.95}
.sum .row{position:relative}
.sum .btn{background:rgba(255,255,255,.12);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.sum .btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* avisos: novedades e instalación */
.newc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 14px 16px 16px;background:var(--lens),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hl),var(--glass-sh)}
.newc-h{display:flex;align-items:center;justify-content:space-between;align-self:stretch}
.newc-t{font:650 calc(16px*var(--fz))/1.36 var(--f-b);letter-spacing:-.012em;text-wrap:pretty}
.newc .btn{margin-top:2px}
.inst{display:flex;flex-direction:column;gap:8px;padding:13px 15px}

/* pestañas internas */
.stabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:999px;background:var(--lens),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--glass-hl),0 6px 18px -10px rgba(10,30,18,.25)}
.stabs button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 6px;border:0;border-radius:999px;background:none;color:var(--ink-2);font:600 calc(14.5px*var(--fz)) var(--f-b);min-width:0;white-space:nowrap;transition:background .25s,color .2s,box-shadow .25s}
.stabs button span{overflow:hidden;text-overflow:ellipsis}
.stabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.04),0 3px 8px -2px rgba(10,30,18,.2)}

/* Plan · asistente de rutina */
.ai{display:flex;flex-direction:column;gap:12px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--pri) 24%,transparent),transparent 58%),var(--surface)}
.ai-h{display:flex;gap:13px;align-items:center}
.ai-h b{display:block;font:var(--dw2) calc(20px*var(--fz))/1.2 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.ai-h .small{display:block;margin-top:2px}

.dchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity}

.day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

.demo-svg .frame{fill:var(--eq-frame)}.demo-svg .stack{fill:var(--eq-metal)}
.demo-svg .plate{fill:color-mix(in srgb,var(--plate) 20%,transparent);stroke:var(--plate);stroke-width:2.4}
.demo-svg .sleeve{fill:var(--plate)}.demo-svg .plate.db{fill:var(--plate);stroke:none}.demo-svg .plate.db.far{opacity:.55}
.demo-svg .handle{fill:var(--eq-metal)}.demo-svg .cable{stroke:var(--eq-metal);stroke-width:1.2}.demo-svg .pulley{fill:var(--eq-metal)}.demo-svg .mat{fill:color-mix(in srgb,var(--pri) 45%,var(--surface))}.demo-svg .band{stroke:var(--band);stroke-width:2.4;stroke-linecap:round;fill:none}
.th-svg .demo-svg .cable,.th-svg .demo-svg .metal{stroke-width:2.4}
.fo-rest.end{animation:ringglow 1.6s ease-in-out infinite}
.fo-tb .stop{flex:1.6;background:var(--fx);color:var(--fx-ink);font-weight:750;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}

/* mapa muscular: cuerpo de frente y espalda */
.mm{display:block;width:100%;height:auto;overflow:visible;--mm-body:color-mix(in srgb,var(--ink) 9%,var(--surface));--mm-base:color-mix(in srgb,var(--ink) 15%,var(--surface));--mm-hi:var(--fill)}
.mm .mm-b{fill:var(--mm-body)}
.mm .mm-m{fill:var(--mm-base)}
.mm .mm-h{fill:var(--mm-hi)}
.mm .mm-o{fill:none;stroke:color-mix(in srgb,var(--ink) 22%,transparent);stroke-width:.6}
.ficha .mm,.mm.on-dark{--mm-body:rgba(255,255,255,.1);--mm-base:rgba(255,255,255,.2);--mm-hi:var(--fx)}
.ficha .mm .mm-o,.mm.on-dark .mm-o{stroke:rgba(255,255,255,.18)}
.mmap-pair{display:flex;gap:4px;align-items:flex-end;justify-content:center}
.mmap-pair svg{width:72px}
.mmap-pair figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mmap-pair figcaption{font:600 calc(12px*var(--fz)) var(--f-b);color:var(--muted)}
.mmc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.mmc .mmap-pair svg{width:84px}
.mml{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mml li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:calc(14px*var(--fz))}
.mml li b{font-weight:650}
.mml .lv{display:inline-flex;align-items:center;gap:6px;font:600 calc(13px*var(--fz)) var(--f-b);color:var(--ink-2);font-variant-numeric:tabular-nums}
.mml .lv i{width:10px;height:10px;border-radius:50%;background:var(--fill)}
.rec-k{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px}
.rec-k .key i{border-radius:50%}

/* medallas */
.medal{display:block;flex:none;filter:drop-shadow(0 4px 6px rgba(14,40,24,.2))}
.medal .rib{fill:var(--accent)}.medal .rib2{fill:color-mix(in srgb,var(--accent) 70%,#000)}
.medal .ic{color:rgba(40,20,0,.72)}
.medal.locked{filter:none;opacity:.9}
.medal.locked .rib,.medal.locked .rib2{fill:var(--line)}
.medal.locked .disc{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.medal.locked .ic{color:var(--muted)}
.lvl-b .hex{fill:url(#mg-gold)}
.medal .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* movimiento: solo para mostrar qué cambió */
main.enter>*{animation:rise .6s var(--soft) both}
main.enter>:nth-child(2){animation-delay:.04s}main.enter>:nth-child(3){animation-delay:.08s}main.enter>:nth-child(4){animation-delay:.12s}main.enter>:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
/* cambio de pestaña con View Transitions: el contenido se funde y sube un poco; la barra y la cabecera quedan quietas */
main{view-transition-name:view}nav.tabs{view-transition-name:nav}.top{view-transition-name:top}.t-box{view-transition-name:timer}.toast{view-transition-name:toast}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(view){animation:vtout .2s var(--ease) both}::view-transition-new(view){animation:vtin .42s var(--soft) both}
::view-transition-group(nav),::view-transition-group(top),::view-transition-group(timer),::view-transition-group(toast){animation:none}
::view-transition-old(nav),::view-transition-old(top),::view-transition-old(timer),::view-transition-old(toast){display:none}::view-transition-new(nav),::view-transition-new(top),::view-transition-new(timer),::view-transition-new(toast){animation:none}
@keyframes vtout{to{opacity:0;transform:scale(.985)}}@keyframes vtin{from{opacity:0;transform:translateY(12px)}}
@keyframes inkin{from{opacity:0;letter-spacing:.04em;filter:blur(3px)}to{opacity:1;filter:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes medal{0%{transform:scale(.4) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,18px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tipout{to{opacity:0;transform:scale(.97)}}
@keyframes bump{50%{transform:scale(1.07)}}
@keyframes flashbg{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 45%,transparent)}to{box-shadow:0 0 0 0 transparent}}
@keyframes pulse{50%{opacity:.45}}

/* tamaños */
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 78px);scroll-padding-bottom:calc(var(--navh) + 24px)}
html:has(body.timing){scroll-padding-bottom:calc(var(--navh) + 130px)}
@media (min-width:520px){.g2col{grid-template-columns:1fr 1fr}.focus{grid-template-columns:repeat(4,minmax(0,1fr))}.focus .fc{padding-top:14px}.f-map svg{width:64px}}
@media (min-width:700px){.hero b{font-size:calc(64px*var(--fz))}.thumb{width:108px;height:90px}.fo-stage,.fo-body{width:min(640px,calc(100% - 28px));margin-left:auto;margin-right:auto}.fo-body{padding-left:0;padding-right:0}}
@media (max-width:440px){.brand span:not(.named){display:none}.brand span{max-width:8rem}}
@media (max-width:420px){.brand span{display:none}}
@media (max-width:370px){.chip{display:none}.thumb{width:76px;height:64px}.f-map svg{width:46px}.ci-q{grid-template-columns:1fr}}
@media (min-width:900px){
 body{padding-left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px));padding-block:0 28px}
 body.timing{padding-block:0 120px}
 nav.tabs{top:12px;bottom:12px;left:calc(12px + env(safe-area-inset-left,0px));right:auto;width:var(--rail);max-width:none;margin:0;border-radius:32px}
 .tab-lens{top:0;bottom:auto;border-radius:22px}
 nav.tabs button{border-radius:22px}
 html.navmin nav.tabs button{padding:12px 0}html.navmin nav.tabs button span{opacity:1;max-height:16px}
 nav.tabs .in{grid-template-columns:1fr;align-content:start;gap:6px;padding:76px 8px 12px}
 nav.tabs button{padding:12px 0}
 .timer{left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px));bottom:14px}
 .upd{left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px))}
 .toast{left:calc(50% + var(--rail) / 2);bottom:18px}
 body.timing .toast{bottom:132px}
 .sheet{align-items:center;padding:24px}
 .sh-box{border-radius:30px;max-height:min(900px,calc(100vh - 48px));transform:translateY(24px) scale(.97);opacity:0;transition:transform .3s var(--ease),opacity .22s;padding-top:18px}
 .sheet.on .sh-box{transform:none;opacity:1}
 .sh-grab{display:none}
 .stage-v{aspect-ratio:auto;height:min(44vh,400px)}
 .scar{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));overflow:visible;margin:0;padding:0}.scard{width:auto}
}
@media (min-width:1100px){
 .in{max-width:1120px}
 main[data-view="hoy"],main[data-view="nut"],main[data-view="prog"]{max-width:880px}
 .timer .in,.upd .in{max-width:760px}
 .sec.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 .sec.g2>:not(.card){grid-column:1/-1}
 .card p,.note p,.bul,.steps{max-width:80ch}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.tab-lens{transition:none!important}.splash{animation:spout .35s ease .9s forwards!important}.splash.out{animation:spout .15s ease forwards!important}.sp-logo .q-ring{stroke-dashoffset:0}}

html,body{margin:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}img{max-width:100%}
body{min-height:100%}
.top{top:0;padding-top:env(safe-area-inset-top,0px)}

svend:["De pie, disco entre las palmas a la altura del pecho, codos abiertos.","Empuja el disco al frente apretando las palmas hasta extender los brazos.","Vuelve en 2 s al pecho sin dejar de apretar.",["Aprieta fuerte el disco","Hombros abajo"],["Aflojar el apretón","Arquear la espalda"]],
lpd:["Muslos firmes bajo el rodillo, agarre algo más ancho que los hombros.","Tira llevando los codos hacia las costillas hasta que la barra llegue a la parte alta del pecho.","Sube en 2 s dejando que los brazos se estiren del todo.",["Pecho alto, inclinación leve atrás","Arriba estira por completo los dorsales"],["Balancear el torso","Tirar con los brazos en vez de la espalda"]],
npd:["Muslos firmes bajo el rodillo, agarre estrecho con las palmas enfrentadas.","Tira llevando los codos hacia abajo y atrás hasta que el agarre llegue al pecho.","Sube en 2 s hasta estirar del todo los brazos.",["Pecho alto, inclinación leve atrás","Arriba deja que los dorsales se estiren"],["Tirar con los brazos","Balancear el torso"]],
spd:["Agarre a la anchura de los hombros con las palmas hacia ti; muslos bajo el rodillo.","Tira los codos hacia las costillas hasta que la barra llegue a la parte alta del pecho.","Sube en 2 s hasta estirar los brazos por completo.",["Codos pegados al cuerpo","Pecho hacia la barra"],["Echarte muy atrás","Medias repeticiones"]],
upd:["Sentado o arrodillado frente a la polea alta, agarre en una mano, brazo estirado.","Lleva el codo hacia la cadera hasta que la mano quede junto al hombro.","Sube en 2 s dejando que el hombro suba y el dorsal se estire.",["Torso quieto","Piensa en el codo, no en la mano"],["Girar el torso para tirar","Encoger el hombro"]],
pdm:["Ajusta el asiento para que los muslos queden firmes bajo el rodillo y toma las asas.","Tira los codos hacia abajo hasta que las asas lleguen a los hombros.","Sube en 2 s hasta estirar los brazos.",["Pecho alto","Recorrido completo arriba"],["Soltar el peso de golpe","Tirar con impulso"]],
pu:["Cuelga de la barra con agarre algo más ancho que los hombros, brazos extendidos.","Sube llevando el pecho a la barra hasta pasar la barbilla.","Baja en 2 s hasta colgar completo.",["Aprieta glúteos y abdomen","Si no llegas a 6, usa banda o máquina asistida"],["Medias repeticiones","Balancearse"]],
chin:["Cuelga de la barra con las palmas hacia ti, manos a la anchura de los hombros.","Sube llevando el pecho hacia la barra hasta pasar la barbilla.","Baja en 2 s hasta colgar con los brazos estirados.",["Codos hacia las costillas","Abdomen firme"],["Balancearse","No bajar del todo"]],
npu:["Cuelga de las asas paralelas con las palmas enfrentadas.","Sube hasta que la barbilla pase las manos.","Baja en 2 s hasta estirar los brazos.",["Hombros lejos de las orejas al subir","Piernas quietas"],["Patalear para subir","Medias repeticiones"]],
apu:["Rodillas en la plataforma, elige la asistencia y toma las asas con los brazos estirados.","Sube hasta pasar la barbilla de las manos.","Baja en 2 s hasta estirar los brazos.",["Más peso en la máquina es más ayuda","Baja la ayuda cuando llegues a 12"],["Rebotar abajo","Encoger los hombros"]],
row:["Siéntate con los pies en la plataforma y las rodillas un poco flexionadas.","Tira del agarre hacia el ombligo llevando los codos atrás.","Vuelve en 2 s dejando que la espalda se estire hacia adelante.",["Pecho alto al tirar","Hombros abajo"],["Echar el torso atrás para tirar","Encoger los hombros"]],
urow:["Sentado frente a la polea baja con un agarre en una mano y la otra en la rodilla.","Tira el codo hacia atrás pegado al cuerpo hasta la cintura.","Vuelve en 2 s dejando que el hombro avance y la espalda se estire.",["Pecho alto","Codo pegado"],["Echarse atrás para tirar","Recorrido corto"]],
csr:["Pecho pegado al apoyo, brazos colgando con las asas en la mano.","Lleva los codos atrás hasta la altura del torso.","Baja en 2 s hasta estirar los brazos y la espalda.",["El pecho no se despega","Codos a ~45° del cuerpo"],["Usar impulso de piernas","Recorrido corto"]],
csdb:["Banco a 30–45°, pecho apoyado y una mancuerna en cada mano colgando.","Lleva los codos atrás hasta que las mancuernas lleguen a la cintura.","Baja en 2 s hasta estirar los brazos.",["El pecho no se despega","Junta las escápulas arriba"],["Levantar el pecho del banco","Tirar con las manos"]],
dbr:["Rodilla y mano del mismo lado en el banco, espalda plana, mancuerna colgando.","Lleva el codo hacia la cadera hasta que la mancuerna llegue a la cintura.","Baja en 2 s dejando que el hombro baje y se estire.",["El torso no gira","Mirada al suelo"],["Tirar con el bíceps","Rotar el torso para subir"]],
dbbr:["De pie, cadera atrás hasta inclinar el torso ~45°, una mancuerna en cada mano.","Tira las mancuernas hacia la cintura llevando los codos atrás.","Baja en 2 s hasta estirar los brazos.",["Espalda neutra","Rodillas un poco flexionadas"],["Erguirse para subir","Redondear la espalda"]],

pend:["Barra en el suelo sobre la mitad del pie, torso casi paralelo al suelo y espalda neutra.","Tira la barra explosivamente hacia la parte baja del pecho.","Bájala controlando hasta apoyarla en el suelo.",["El torso no se levanta","Pausa breve en el suelo"],["Usar las piernas para tirar","Redondear la espalda"]],
yates:["Agarre supino a la anchura de los hombros, torso inclinado ~30°.","Tira la barra hacia el ombligo con los codos pegados.","Baja en 2 s hasta estirar los brazos.",["Codos rozando el torso","Espalda neutra"],["Balancear el torso","Encoger los hombros"]],
tbar:["Montado sobre la barra, toma el agarre con el torso inclinado ~45° y la espalda neutra.","Tira el agarre hacia el pecho llevando los codos atrás.","Baja en 2 s hasta estirar los brazos.",["Pecho alto","Rodillas un poco flexionadas"],["Erguirse para tirar","Redondear la espalda"]],
meadows:["De lado a la barra anclada, pie adelantado, torso inclinado y la punta de la barra en una mano.","Tira el codo hacia arriba y atrás hasta la cadera.","Baja en 2 s dejando que el hombro se estire.",["Apoya el antebrazo libre en la rodilla","Codo abierto ~45°"],["Girar el torso","Tirar con el bíceps"]],
seal:["Tumbado boca abajo en un banco alto, barra o mancuernas colgando con los brazos estirados.","Tira hacia el banco llevando los codos atrás.","Baja en 2 s hasta estirar los brazos.",["El pecho no se despega","Junta las escápulas arriba"],["Levantar la cabeza y el pecho","Recorrido corto"]],

mrow:["Ajusta el asiento para que las asas queden a la altura del pecho bajo; pecho en el apoyo.","Tira las asas llevando los codos atrás.","Vuelve en 2 s hasta estirar los brazos.",["Junta las escápulas","Pecho pegado al apoyo"],["Despegar el pecho","Encoger los hombros"]],
pov:["Frente a la polea alta, cadera atrás, brazos casi rectos arriba.","Lleva la barra o cuerda hasta los muslos en un arco.","Sube en 2 s hasta sentir el estiramiento de los dorsales.",["Codos casi fijos","Torso quieto"],["Doblar los codos (se vuelve tríceps)","Balancear el cuerpo"]],
mpov:["Ajusta el asiento para que los hombros queden alineados con el eje de la máquina; codos en las almohadillas.","Lleva los brazos en arco desde arriba hasta la cadera.","Vuelve en 2 s hasta el estiramiento máximo.",["Torso quieto","Abdomen firme"],["Arquear la espalda","Soltar el peso arriba"]],

dl:["Pies a la anchura de la cadera, barra sobre la mitad del pie; agáchate, toma la barra y saca el pecho con la espalda neutra.","Empuja el suelo y extiende cadera y rodillas a la vez hasta quedar erguido.","Baja en 2 s llevando la cadera atrás y deslizando la barra por las piernas.",["La barra sube rozando las piernas","Aprieta los dorsales antes de tirar"],["Redondear la espalda","Hiperextender la lumbar arriba"]],
sumo:["Pies muy abiertos con las puntas afuera, manos por dentro de las rodillas y espalda neutra.","Empuja el suelo abriendo las rodillas y extiende la cadera hasta quedar erguido.","Baja en 2 s con la barra pegada.",["Rodillas en la línea de los pies","Pecho alto"],["Rodillas hacia adentro","Tirar con la espalda redondeada"]],
tbdl:["Dentro de la barra hexagonal, toma las asas con la espalda neutra y la cadera algo más baja que en el convencional.","Empuja el suelo hasta quedar erguido.","Baja en 2 s controlando.",["Hombros sobre las asas","Mirada al frente"],["Redondear la espalda","Soltar la barra al bajar"]],
rack:["Barra en bloques o el rack a la altura de las rodillas; agarre fuera de las piernas y espalda neutra.","Extiende la cadera hasta quedar erguido apretando la espalda.","Baja en 2 s hasta apoyar la barra.",["Hombros atrás arriba","Barra pegada"],["Hiperextender la espalda","Rebotar en los bloques"]],

cpt:["De espaldas a la polea baja, cuerda entre las piernas y un par de pasos adelante.","Extiende la cadera hasta quedar erguido apretando los glúteos.","Lleva la cadera atrás en 2 s dejando que la cuerda pase entre las piernas.",["Brazos estirados y pasivos","Espalda neutra"],["Tirar con los brazos","Doblar mucho las rodillas"]],
hyper:["Cadera apoyada en el cojín, pies fijos, brazos cruzados.","Sube el torso hasta quedar en línea con las piernas.","Baja en 2 s flexionando la cadera.",["Aprieta glúteos arriba","Barbilla recogida"],["Hiperextender la lumbar","Usar impulso"]],

mp:["De pie, barra apoyada delante de los hombros, agarre al ancho de hombros.","Empuja en línea recta; la cabeza se aparta y vuelve bajo la barra.","Baja en 2 s hasta la clavícula.",["Glúteos y abdomen apretados","Codos un poco por delante de la barra"],["Inclinarse hacia atrás","Empujar con las piernas"]],

cfr:["De espaldas a la polea baja, el cable pasa entre las piernas y el agarre frente a los muslos.","Sube los brazos al frente hasta la altura de los hombros.","Baja en 2 s.",["Abdomen firme","Brazos casi rectos"],["Echarse atrás","Encoger los hombros"]],

rup:["De pie con la barra frente a los muslos y agarre algo más ancho que los hombros.","Sube la barra pegada al cuerpo llevando los codos hacia los lados y arriba hasta el pecho.","Baja en 2 s.",["Los codos lideran","Hasta el pecho, no al mentón"],["Agarre muy cerrado","Subir con impulso"]],

rdel:["Siéntate de frente al respaldo, asas al frente a la altura de los hombros.","Abre los brazos casi rectos hacia atrás en un arco amplio.","Vuelve en 2 s al frente.",["Hombros abajo","Pausa breve atrás"],["Juntar las escápulas en exceso","Doblar los codos"]],
fp:["Polea a la altura de la cara, cuerda con agarre neutro.","Tira hacia la cara separando las manos, codos altos.","Vuelve en 2 s estirando los brazos.",["Codos a la altura de los hombros","Rota hacia afuera al final"],["Tirar hacia el pecho","Echarse atrás"]],
drdel:["De pie con el torso inclinado ~45°, mancuernas colgando.","Abre los brazos hacia los costados con los codos un poco flexionados.","Baja en 2 s.",["Espalda neutra","Peso ligero"],["Usar impulso","Encoger los hombros"]],
crd:["Entre dos poleas a la altura del hombro, toma cada cable con la mano contraria, brazos al frente.","Abre los brazos hacia los lados y atrás en un arco amplio.","Vuelve en 2 s al frente.",["Brazos casi rectos","Hombros abajo"],["Tirar con la espalda","Arquear el torso"]],
ytr:["Pecho apoyado en un banco a 30–45° y una mancuerna ligera en cada mano.","Sube los brazos estirados en forma de Y hasta la línea del torso.","Baja en 2 s.",["Pulgares hacia arriba","Peso ligero"],["Encoger los hombros","Levantar el pecho del banco"]],

bpa:["De pie con una banda elástica sujeta al frente a la altura de los hombros, brazos estirados.","Separa las manos hacia los lados hasta que la banda toque el pecho.","Vuelve en 2 s.",["Junta las escápulas","Brazos casi rectos"],["Encoger los hombros","Arquear la espalda"]],
shr:["De pie con la barra frente a los muslos, agarre a la anchura de los hombros.","Sube los hombros hacia las orejas lo más alto que puedas; pausa 1 s.","Baja en 2 s hasta estirar el trapecio.",["Brazos estirados","Sin girar los hombros"],["Doblar los codos","Hacer rebote"]],

smshr:["De pie frente a la barra de la Smith a la altura de los muslos.","Sube los hombros lo más alto que puedas; pausa 1 s.","Baja en 2 s.",["Agarre firme","Pausa arriba"],["Doblar los codos","Encorvarse"]],
farm:["De pie con una mancuerna pesada en cada mano a los lados.","Camina con pasos cortos y el torso erguido durante el tiempo indicado.","Deja las pesas en el suelo con la espalda neutra.",["Hombros atrás","Abdomen firme"],["Inclinarse hacia un lado","Encorvarse"]],
wc:["Sentado con los antebrazos sobre los muslos y las palmas hacia arriba sujetando la barra.","Flexiona las muñecas subiendo la barra lo más alto posible.","Baja en 2 s dejando que la barra ruede hasta los dedos.",["Antebrazos quietos","Recorrido completo"],["Mover los codos","Hacerlo con rebote"]],

function chime(t){const g0=AL.g;if(!g0)return;[[1046.5,0],[1318.5,.14],[1568,.28],[2093,.42]].forEach(([f,o],i)=>{const os=AC.createOscillator(),g=AC.createGain();os.type=i===3?'triangle':'sine';os.frequency.value=f;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(i===3?.16:.3,t+o+.012);g.gain.exponentialRampToValueAtTime(.0001,t+o+.62);os.connect(g).connect(g0);os.start(t+o);os.stop(t+o+.66)})}
function alarmArm(at){alarmOff();unlockAudio();if(!AC)return;try{AL.g=AC.createGain();AL.g.gain.value=1;AL.g.connect(AC.destination);const ka=AC.createOscillator(),kg=AC.createGain();kg.gain.value=.00001;ka.connect(kg).connect(AL.g);ka.start();AL.ka=ka;AL.next=Math.max(AC.currentTime+.05,AC.currentTime+(at-Date.now())/1000);alarmFill(45)}catch(e){}}
function alarmFill(ahead){if(!AC||!AL.g)return;AL.next=Math.max(AL.next,AC.currentTime+.05);while(AL.next<AC.currentTime+ahead){chime(AL.next);AL.next+=1.7}}
function alarmOff(){clearInterval(AL.iv);clearInterval(AL.vib);AL.iv=AL.vib=0;try{AL.ka&&AL.ka.stop()}catch(e){}try{AL.g&&AL.g.disconnect()}catch(e){}AL.g=AL.ka=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function ringStart(){T.ring=1;$('#timer').classList.add('alarm');if(!AL.g)alarmArm(Date.now());AL.iv=setInterval(()=>alarmFill(20),1000);const vb=()=>{try{navigator.vibrate&&navigator.vibrate([420,160,420])}catch(e){}};vb();AL.vib=setInterval(vb,1700)}
function ringStop(){T.ring=0;$('#timer').classList.remove('alarm');alarmOff()}
function showTimer(){$('#timer').hidden=false;document.body.classList.add('timing');clearInterval(T.iv);T.iv=setInterval(tick,250);tick()}
function startRest(sec,lab){ringStop();T.dur=sec;T.end=Date.now()+sec*1000;T.lab=lab;T.s10=sec<=12?1:0;lsSet('bh-timer',JSON.stringify({end:T.end,dur:T.dur,lab}));alarmArm(T.end);showTimer();if(S.fo)renderFocus()}
function stopRest(){ringStop();clearInterval(T.iv);T.end=0;$('#timer').hidden=true;document.body.classList.remove('timing');lsDel('bh-timer');const r=$('#fo-rest');r&&r.remove()}
function restoreTimer(){try{const t=JSON.parse(lsGet('bh-timer')||'null');if(t&&t.end>Date.now()+1000){T.end=t.end;T.dur=t.dur;T.lab=t.lab||'';alarmArm(T.end);showTimer()}else lsDel('bh-timer')}catch(e){}}
function tick(){const left=(T.end-Date.now())/1000,ft=$('#fo-time');if(left<=0){clearInterval(T.iv);$('#t-time').textContent='0:00';$('#t-lab').textContent='¡Tiempo! Siguiente: '+T.lab;$('#t-prog').style.width='100%';if(!T.ring){ringStart();say('Tiempo. '+cap(T.lab)+'.')}lsDel('bh-timer');if(S.fo)renderFocus();return}
 if(left<=10.2&&!T.s10){T.s10=1;say('Diez segundos')}
 $('#t-time').textContent=mmss(Math.ceil(left));$('#t-lab').textContent='Descanso: '+T.lab;$('#t-prog').style.width=(100*(1-left/T.dur)).toFixed(1)+'%';
 if(ft){ft.textContent=mmss(Math.ceil(left));const rv=$('#fo-rv'),c=2*Math.PI*44;rv&&rv.setAttribute('stroke-dasharray',`${(c*Math.min(1,1-left/T.dur)).toFixed(1)} ${c.toFixed(1)}`)}}
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

 else if(rec==='sup'&&p.phase!=='sup')h+=`<div class="note"><p>Con ${bfT} estás en buen punto para un <b>superávit ligero</b>${gl('sup')}.</p></div>`;
 else if(rec==='unk'&&n.bf==null)h+=`<div class="note"><p>Mide cuello y cintura para afinar tu fase.</p><div class="row"><button class="btn sm" data-go="ajustes:datos">Ir a mis datos</button></div></div>`;
 h+=`<div class="card kc"><div class="row between"><span class="eyebrow">Tu objetivo diario en ${n.ph.n.toLowerCase()}</span>${gl(p.phase)}</div><div class="hero"><b>${nf(n.kcal)}</b><span>kcal/día</span></div>

 <div class="mbar" role="img" aria-label="Proteína ${Math.round(n.P*400/tot)} %, grasa ${Math.round(n.F*900/tot)} %, carbohidratos ${Math.round(n.C*400/tot)} %"><i style="width:${n.P*400/tot}%;background:var(--s1)"></i><i style="width:${n.F*900/tot}%;background:var(--s2)"></i><i style="width:${n.C*400/tot}%;background:var(--s3)"></i></div>
 <div class="mleg"><div><span class="key"><i style="background:var(--s1)"></i>Proteína</span><b>${n.P} g</b><span class="small muted">${n.Pl}–${n.Ph} g</span></div><div><span class="key"><i style="background:var(--s2)"></i>Grasa</span><b>${n.F} g</b><span class="small muted">${Math.round(n.F*900/tot)} %</span></div><div><span class="key"><i style="background:var(--s3)"></i>Carbos</span><b>${n.C} g</b><span class="small muted">el resto</span></div></div></div>`;
 h+=flCard(n)+waterCard(n);
 if(!ri)h+=`<div class="card"><div class="row between"><b class="ttl">${ICON.scale}Calibración${gl('cal')}</b><span class="mono small muted">${Math.min(5,S.weights.length)}/5 pesajes</span></div><p class="small ink2">Pésate cada mañana: con 5 registros ajusto tus calorías a tu ritmo real.</p><div class="row" style="margin-top:8px"><button class="btn sm" data-act="go-peso">${ICON.scale}Registrar peso</button></div></div>`;
 else h+=`<div class="card col"><div class="row between"><b class="ttl">${ICON.scale}Calibración${gl('cal')}</b><span class="pill ${adj.status==='ok'?'good':'warn'}">${adj.status==='ok'?'✓ En rango':adj.status==='fast'?'! Más rápido':'! Más lento'}</span></div><div class="nchips">${nchip(ICON.scale,`<span class="mono">${sg(ri.perWk)}</span>`,'kg/sem real')}${nchip(ICON.target,`<span class="mono">${sg(n.rate)}</span>`,'objetivo')}${nchip(ICON.flame,nf(rnd(adj.maint,10)),'mantenimiento real')}</div><div class="row">${adj.dk?`<button class="btn sm pri" data-act="adj" data-v="${adj.dk}">Aplicar ${adj.dk>0?'+':'−'}${Math.abs(adj.dk)} kcal/día</button>`:'<span class="small ink2">Mantén las calorías y revisa en una semana.</span>'}${p.kcalAdj?`<button class="btn sm ghost" data-act="adj0">Quitar ajustes</button>`:''}</div></div>`;
 h+=`<div class="nchips">${nchip(ICON.egg,'~'+Math.round(n.P/4)+' g','proteína por comida')}${nchip(ICON.spark,'≥ '+n.fib+' g','de fibra')}${nchip(ICON.drop,'~'+nf(n.water,1)+' L','de agua')}</div>`;
 h+=fold('claves','Claves de esta fase',`<ul class="bul">${TIPS[p.phase].map(t=>`<li>${t}</li>`).join('')}</ul>`,{ic:ICON.spark,sum:n.ph.n});
 h+=fold('calc','Cómo se calcula',`<p class="small ink2">Gasto basal ${nf(n.bmr)} kcal (Mifflin-St Jeor) × ${nf(n.neat,2)} por actividad + ${nf(n.gym)} del gym + ${nf(n.sport)} de otro deporte = ${nf(n.tdee)} kcal. Proteína sobre un peso de referencia de ${kg(rnd(n.ref,.1))}${n.bf!=null?` (~${nf(n.bf,1)} % de grasa)`:n.bmi>25?' (peso con IMC 25)':''}.</p><div class="row"><button class="btn sm" data-go="ajustes:datos">Editar mis datos</button></div>`,{ic:ICON.info,sum:'Fórmulas y tus datos'});
 return h}

function nutSup(n){const S2=[['Creatina monohidrato','3–5 g al día, sin fase de carga','El suplemento con más evidencia para fuerza y masa magra. A cualquier hora.'],['Cafeína','Opcional: ~'+rnd(3*n.W,10)+' mg antes de entrenar','~3 mg/kg, 45–60 min antes. Evítala después de las 15–16 h para no robarle horas al sueño.'],['Proteína en polvo','Solo si con comida no llegas','Para completar tus '+n.P+' g diarios; no tiene nada mágico.'],['Vitamina D','Solo con un análisis que muestre déficit',''],['No vale la pena','BCAA, glutamina, quemadores, “boosters”','Si ya comes suficiente proteína no suman nada.']];
 return `<div class="card"><b class="ttl">${ICON.check}Suplementos con evidencia</b><ul class="dl supp">${S2.map(([a,b,c])=>`<li><b>${a}</b><span>${b}${c?`<span class="small muted"> · ${c}</span>`:''}</span></li>`).join('')}</ul></div>
 <div class="card"><b class="ttl">${ICON.clock}Recuperación</b><ul class="bul"><li><b>Sueño 7–9 h.</b> Una noche sin dormir bajó la síntesis de proteína muscular un 18 %.</li><li><b>Cardio sí:</b> 8–10 mil pasos o 2–3 sesiones moderadas no frenan la hipertrofia.</li><li><b>Agua:</b> en la altura pierdes más al respirar; ve por ~${nf(n.water,1)} L.</li></ul></div>`}

const MX=[['waist','Cintura'],['hip','Cadera'],['chest','Pecho'],['arm','Brazo'],['thigh','Muslo']];
const lastM=k=>{for(let i=S.weights.length-1;i>=0;i--)if(S.weights[i][k]!=null)return S.weights[i][k];return null};
function vProg(){const t=S.pt||'peso';
 return `<div class="sec-h"><h2>Progreso</h2><span class="eyebrow">${S.sessions.filter(s=>s.done).length} sesiones y ${S.weights.length} pesajes</span></div>${subTabs('pt',[['peso','Peso'],['entreno','Entreno'],['logros','Logros'],['fotos','Fotos']],t)}${t==='entreno'?progEnt():t==='logros'?vBadges():t==='fotos'?progFotos():progPeso()}`}
function progPeso(){const tw=trend(S.weights),last=tw[tw.length-1],ri=rateInfo(S.weights),n=nutri();
 let h=`<section class="sec" id="peso">${tipOnce('peso','Pésate cada mañana en ayunas: la línea de tendencia ignora los saltos de un día.')}<div class="card"><div class="wform"><div class="field"><label for="wd">Fecha</label><input id="wd" type="date" value="${ymd()}" max="${ymd()}"></div><div class="field"><label for="wk">Peso (kg)</label><input id="wk" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${last?nf(last.kg,1):nf(S.prof.w,1)}"></div><button class="btn pri" data-act="wsave">Guardar</button></div>
 ${fold('medx','Más medidas',`<div class="fields m5">${MX.map(([k,l])=>{const v=lastM(k);return `<div class="field"><label for="wm-${k}">${l} <span class="muted">(cm)</span></label><input id="wm-${k}" data-m="${k}" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${v!=null?nf(v,1):'opcional'}"></div>`}).join('')}</div><p class="small muted">Cada 2 semanas, en el mismo punto y relajado.</p>`,{ic:ICON.target,sum:'Cintura, cadera, pecho, brazo y muslo',cls:'flat'})}</div>`;
 if(last){const first=tw[0],st=ri?adjust(n,ri).status:null;h+=`<div class="stats">${stat('Tendencia'+gl('trend'),kg(rnd(last.t,.1)),`último ${kg(last.kg)}`)}${stat('Ritmo (3 sem)',ri?`<span class="mono">${sg(ri.perWk)}</span> <span class="small">kg/sem</span>`:'—',ri?`<span class="pill ${st==='ok'?'good':'warn'}">${st==='ok'?'✓ En rango':st==='fast'?'Muy rápido':'Muy lento'}</span> objetivo ${sg(n.rate)}`:'5 pesajes en 10+ días')}${stat('Desde el inicio',`<span class="mono">${sg(last.t-first.kg,1)}</span> <span class="small">kg</span>`,`desde ${dl(first.date)}`)}</div>`}
 h+=`<div class="card col"><div class="row between"><div class="legend"><span class="key"><i class="dot" style="background:color-mix(in srgb,var(--ink-2) 55%,transparent)"></i>Diario</span><span class="key"><i class="ln" style="background:var(--accent)"></i>Tendencia</span><span class="key"><i class="dash"></i>Objetivo</span></div><div class="seg sm">${[[28,'4 sem'],[84,'12 sem'],[0,'Todo']].map(([v,l])=>`<button data-act="range" data-v="${v}" aria-pressed="${S.range===v}">${l}</button>`).join('')}</div></div><div class="chart" data-chart="w"></div></div>`;
 const mr=MX.map(([k,l])=>{const a=S.weights.filter(w=>w[k]!=null);if(!a.length)return'';const f=a[0],z=a[a.length-1],d=z[k]-f[k];return `<li><span>${l}</span><span class="mono">${nf(z[k],1)} cm${a.length>1?` <span class="dlt">${sg(d,1)}</span>`:''}</span></li>`}).join('');
 if(mr)h+=`<div class="card"><b class="ttl">${ICON.target}Medidas</b><ul class="dl">${mr}</ul><p class="small muted">Cambio desde tu primera medición.</p></div>`;
 const wl=S.weights.slice(-15).reverse();if(wl.length)h+=fold('wh','Registros de peso',`<ul class="hist">${wl.map(w=>`<li><span class="mono">${dl(w.date,{weekday:'short',day:'numeric',month:'short'})} · ${kg(w.kg)}${MX.some(([k])=>w[k]!=null)?` · ${MX.filter(([k])=>w[k]!=null).map(([k,l])=>l.toLowerCase()+' '+nf(w[k],1)).join(', ')}`:''}</span><button class="btn sm ghost danger" data-act="delw" data-v="${w.id}">${S.confirm==='w'+w.id?'¿Borrar?':'Borrar'}</button></li>`).join('')}</ul>`,{ic:ICON.book,sum:`${S.weights.length} en total`});
 return h+'</section>'}
function calHTML(){const off=S.cal||0,b=new Date();b.setDate(1);b.setMonth(b.getMonth()+off);const y=b.getFullYear(),mo=b.getMonth(),nd=new Date(y,mo+1,0).getDate(),lead=(new Date(y,mo,1).getDay()+6)%7,pre=`${y}-${String(mo+1).padStart(2,'0')}-`,by={},today=ymd(),R=S.prof.rem?remOf(S.prof).wd:[];
 for(const s of S.sessions)if(s.done&&s.date.startsWith(pre))(by[s.date]=by[s.date]||[]).push(s);const cnt=Object.values(by).reduce((a,x)=>a+x.length,0);let c='';
 for(let i=0;i<lead;i++)c+='<span class="cd e"></span>';
 for(let d=1;d<=nd;d++){const ds=pre+String(d).padStart(2,'0'),ss=by[ds],wd=(lead+d-1)%7,cl=(ds===today?' today':'')+(!ss&&ds>today&&R.includes(wd)?' plan':'');c+=ss?`<button class="cd on${cl}" data-act="cal-day" data-v="${ds}" aria-label="${dl(ds,{weekday:'long',day:'numeric',month:'long'})}: ${ss.map(s=>s.name).join(', ')}" aria-expanded="false">${d}</button>`:`<span class="cd${cl}">${d}</span>`}
 return `<div class="card cal"><div class="cal-h"><button class="ibtn sm" data-act="cal-nav" data-v="-1" aria-label="Mes anterior">${ICON.back}</button><b>${cap(b.toLocaleDateString('es-BO',{month:'long',year:'numeric'}))}</b><button class="ibtn sm fwd" data-act="cal-nav" data-v="1" aria-label="Mes siguiente"${off>=0?' disabled':''}>${ICON.back}</button></div><div class="cal-g" role="group" aria-label="Días entrenados">${WDL.map(l=>`<span class="cw" aria-hidden="true">${l}</span>`).join('')}${c}</div><div class="nchips">${nchip(ICON.dumb,cnt,cnt===1?'sesión este mes':'sesiones este mes')}${nchip(ICON.flame,stats().cur,'sem. de racha')}</div></div>`}

function coachBody(){if(BUILD==='art'&&S.sample===undefined)return '<p class="small muted">Conectando…</p>';
 if(BUILD==='art'&&S.sample)return `<p class="small ink2">Lee tus registros y te propone ajustes concretos para la próxima semana.</p><div class="row"><button class="btn sm pri" data-act="coach"${S.coach.busy?' disabled':''}>Revisar mi semana</button>${S.coach.busy?'<button class="btn sm ghost" data-act="stop">Detener</button>':''}</div><div class="field"><label for="cq">O pregúntale algo</label><textarea id="cq" placeholder="Ej.: me estanqué en press banca, ¿qué cambio?">${esc(S.coach.q)}</textarea></div><div class="row"><button class="btn sm" data-act="ask"${S.coach.busy?' disabled':''}>Preguntar</button></div><div id="cout" class="cout" aria-live="polite">${esc(S.coach.text)}</div>${S.coach.err?`<p class="err">${esc(S.coach.err)}</p>`:''}`;

 return `<section class="sec">${calHTML()}${recCard()}

 ${fold('hist','Historial de sesiones',hs.length?`<ul class="hist">${hs.map(s=>`<li><span><b>${esc(s.name)}</b> <span class="muted small">· ${dl(s.date,{weekday:'short',day:'numeric',month:'short'})}, ${countDone(s)} series</span></span><button class="btn sm ghost danger" data-act="dels" data-v="${s.id}">${S.confirm==='s'+s.id?'¿Borrar?':'Borrar'}</button></li>`).join('')}</ul>`:'<div class="empty">Aún no terminaste ninguna sesión.</div>',{ic:ICON.book,sum:`${S.sessions.filter(s=>s.done).length} terminadas`})}</section>`}

const AIP='Eres el asistente de una app de hipertrofia. Convierte el pedido del usuario en ajustes de su rutina. Responde SOLO con un objeto JSON, sin texto extra: {"goal":"eq|glu|tor|arm" o null,"pri":{"pe|es|ho|bi|tr|cu|is|gl|ge|ab":0|1|2},"equip":"gym|basic|home" o null,"mins":45|60|75|90 o null,"days":3|4|5|6 o null,"lvl":"pri|int" o null,"nota":"una o dos frases en español, cálidas y concretas, explicando el cambio"}. goal: eq equilibrado, glu glúteos y piernas, tor pecho/hombros/espalda, arm brazos y hombros. Claves de pri: pe pecho, es espalda, ho hombros, bi bíceps, tr tríceps, cu cuádriceps, is isquios, gl glúteos, ge gemelos, ab abdomen; solo para músculos mencionados (2 priorizar, 0 solo mantener). Usa null en lo que no se mencione. Si pide algo médico o de lesiones, no cambies nada y en la nota sugiere consultar a un profesional.';
async function aiClaude(q){const p=S.prof,ctx2=`Perfil: ${p.sex==='f'?'mujer':'hombre'}, ${p.age} años, nivel ${p.lvl==='int'?'intermedio':'principiante'}, ${p.days} días, sesiones de ${p.mins||60} min, equipo: ${EQL[p.equip||'gym'][0]}, enfoque actual: ${FOCUS[focusOf(p)][0]}.`,prompt=AIP+'\n\n'+ctx2+'\nPedido: '+q,off=['not_granted','sampling_disabled','not_declared','capability_disabled'];let j=null;
 try{if(typeof S.sample.json==='function')j=await S.sample.json(prompt,{modelTier:'quick',cache:false})}catch(e){if(e&&off.includes(e.code)){S.sample=null;return null}if(!(e&&(e.code==='capability_removed'||e.code==='invalid_json')))throw e}
 if(!j||typeof j!=='object'){const r=await S.sample(prompt,{modelTier:'quick',cache:false}),m=String((r&&r.text)||'').match(/\{[\s\S]*\}/);if(!m)return null;try{j=JSON.parse(m[0])}catch(e){return null}}
 return aiFromJSON(j,p)}
async function aiGo(){const el=$('#aiq'),q=String((el&&el.value)||S.ai.q||'').trim();S.ai.q=q;S.ai.undo=null;S.ai.res=null;if(!q){S.ai.err='Escribe tu objetivo o toca un ejemplo.';return render()}S.ai.err='';
 let r=null;if(BUILD==='art'&&S.sample){S.ai.busy=true;render();try{r=await aiClaude(q)}catch(e){r=null}S.ai.busy=false}
 if(!r||(!r.lines.length&&!r.note)){const k=parseGoal(q,S.prof);if(k&&k.lines.length)r=k}
 if(r&&r.lines.length){const P=priOf({...S.prof,...r.ch}),ly=a=>a.join(', ').replace(/, ([^,]*)$/,' y $1'),hi=MKG.filter(m=>P[m]===2).map(m=>MK[m].toLowerCase()),lo=MKG.filter(m=>P[m]===0).map(m=>MK[m].toLowerCase());r.sum=`Así quedaría: ${hi.length?'prioridad en '+ly(hi):'todo el cuerpo por igual'}${lo.length?'; '+ly(lo)+' en mantenimiento':''}.`}
 if(!r||(!r.lines.length&&!r.note))S.ai.err='No encontré cambios para hacer. Prueba con algo como «priorizar glúteos», «solo tengo mancuernas en casa» o «45 minutos, 3 días».';else S.ai.res=r;
 render();const o=$('.ai-res')||$('.ai .err');o&&o.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'})}
function aiApply(){const r=S.ai.res;if(!r||!r.lines.length)return;const prev={};for(const k of Object.keys(r.ch))prev[k]=S.prof[k]===undefined?null:JSON.parse(JSON.stringify(S.prof[k]));S.ai.undo=prev;S.ai.res=null;S.ai.q='';setProf(r.ch);toast('Rutina actualizada: '+r.lines.join(' · '),'win')}

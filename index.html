.lvl-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.lvl-t>b{font:var(--dw2) calc(21px*var(--fz))/1.15 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.lvl-t>span{font-size:calc(14px*var(--fz));color:var(--ink-2);font-variant-numeric:tabular-nums}
.xpb{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden;box-shadow:var(--well)}
.xpb i{display:block;height:100%;border-radius:9px;background:var(--foil);transition:width .6s var(--ease)}
.lvl-t small{font-size:calc(13px*var(--fz));color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.badge{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px 12px;border-radius:20px;border:1px solid var(--edge);background:var(--surface);box-shadow:var(--hi),var(--sh1)}
.badge .medal{width:64px;height:64px}
.badge b{font:650 calc(13.5px*var(--fz))/1.2 var(--f-b)}
.badge .bd{font-size:calc(12.5px*var(--fz));color:var(--muted);line-height:1.3}
.badge:not(.ok) b{color:var(--ink-2)}
.bprog{width:78%;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:2px;box-shadow:var(--well)}.bprog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bnum{font-size:calc(12px*var(--fz));color:var(--muted);font-variant-numeric:tabular-nums}
.badge .pill.new{position:absolute;top:7px;right:7px}

/* Guía · biblioteca de ejercicios y ciencia */
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.libr{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:6px 12px 6px 6px;border-radius:18px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);text-align:left}
.libr:active{background:var(--surface-2)}
.libr-th{width:60px;height:50px;border-radius:13px;background:radial-gradient(120% 100% at 50% 0%,var(--surface),var(--surface-2) 85%);box-shadow:var(--well);overflow:hidden}
.libr-t{display:flex;flex-direction:column;min-width:0}
.libr-t b{font:650 calc(15.5px*var(--fz))/1.25 var(--f-b)}
.libr-t span{font-size:calc(13px*var(--fz));color:var(--muted)}
.libr .pill{margin-right:2px}
.lib-n{font-size:calc(14px*var(--fz));color:var(--muted)}
.scar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 14px;scroll-padding:0 16px}
.scar::-webkit-scrollbar{display:none}
.scard{flex:none;width:min(80%,330px);min-height:236px;display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:20px;border-radius:24px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);text-align:left;box-shadow:var(--hi),var(--sh2);scroll-snap-align:start;transition:transform .15s var(--ease)}
.scard:active{transform:scale(.98)}
.scard-n{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.scard-n svg.i{width:21px;height:21px}
.scard.k1 .scard-n{background:color-mix(in srgb,var(--accent-2) 16%,var(--surface));color:var(--accent-2)}
.scard.k2 .scard-n{background:var(--hero);color:var(--fx)}
.scard b{font:var(--dw) calc(24px*var(--fz))/1.12 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.scard-a{font-size:calc(15px*var(--fz));color:var(--ink-2);flex:1}
.scard-m{font:650 calc(14px*var(--fz)) var(--f-b);color:var(--accent)}
.sidx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.refs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.refs a{font:500 calc(13.5px*var(--fz)) var(--f-b);text-decoration:none}
.refs a:hover{text-decoration:underline}
.sci-nav{justify-content:space-between;margin-top:6px}

/* perfil */
.pf-top{align-items:center}
.pf-hero{display:flex;align-items:center;gap:15px;margin-bottom:14px}
.avatar{display:grid;place-items:center;border-radius:50%;background:var(--hero);color:var(--hero-ink);font:var(--dw) calc(24px*var(--fz)) var(--f-d);font-stretch:var(--dst);flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px color-mix(in srgb,var(--fx) 80%,transparent),0 12px 24px -12px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.avatar.big{width:68px;height:68px;font-size:calc(30px*var(--fz))}.avatar svg.i{width:28px;height:28px}
.pf-hero h2{font:var(--dw) calc(28px*var(--fz))/1.12 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst)}
.pf-lv{display:flex;align-items:center;gap:8px;margin-top:6px;font:650 calc(13.5px*var(--fz)) var(--f-b);color:var(--accent-2)}
.pf-lv .xpb{width:90px;height:6px}
.pf-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.pf-stats span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;border-radius:17px;background:var(--surface);border:1px solid var(--edge);font-size:calc(13px*var(--fz));color:var(--muted);text-align:center}
.pf-stats b{font:var(--dw) calc(26px*var(--fz))/1 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);color:var(--ink);font-variant-numeric:lining-nums}
.pf-list{display:flex;flex-direction:column;border-radius:var(--r);border:1px solid var(--edge);background:var(--surface);overflow:hidden}
.pf-row{display:flex;align-items:center;gap:13px;width:100%;min-height:66px;padding:10px 14px;border:0;border-top:1px solid var(--line-2);background:none;color:var(--ink);text-align:left}
.pf-row:first-child{border-top:0}.pf-row:active{background:var(--surface-2)}
.pf-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pf-ic svg.i{width:20px;height:20px}
.pf-t{flex:1;min-width:0;display:flex;flex-direction:column}
.pf-t b{font:650 calc(16px*var(--fz))/1.25 var(--f-b)}
.pf-t span{font-size:calc(13.5px*var(--fz));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fontc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;min-width:0}
.fontc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fontc-s{font-size:calc(27px*var(--fz));line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fontc-n{font:650 calc(14px*var(--fz)) var(--f-b)}
.fontc-d{font-size:calc(12px*var(--fz));color:var(--muted)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:340px}
.wd{width:100%;aspect-ratio:1;max-width:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 calc(15px*var(--fz)) var(--f-b);color:var(--ink-2);box-shadow:var(--hi);padding:0}
.wd[aria-pressed="true"]{background:var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:0 6px 12px -8px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.fz-demo{font-size:calc(16px*var(--fz));padding:11px 13px;border-radius:13px;background:var(--surface-2)}
.glist{padding:14px 0 4px}.glist>b.ttl{padding:0 16px;margin-bottom:4px}
.info{display:flex;flex-direction:column;gap:11px;font-size:calc(15.5px*var(--fz))}
.info .apply{font-weight:650;font-size:calc(17px*var(--fz))}
.news{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:calc(15.5px*var(--fz))}
.news li::marker{color:var(--accent-2)}
.ob{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

/* primer uso: una pregunta por pantalla */
.wiz{display:flex;flex-direction:column;gap:18px;padding:20px}
.wiz-top{display:flex;flex-direction:column;gap:10px}
.wiz-lab{display:flex;justify-content:space-between;gap:10px;font:600 calc(13.5px*var(--fz))/1.3 var(--f-b);color:var(--muted)}
.wiz-lab span+span{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ob-cover{padding:26px 24px 22px;display:flex;flex-direction:column;gap:20px;animation:rise .5s var(--ease) both}
.ob-head{display:flex;align-items:center;gap:16px}
.ob-cover+.wiz .wiz-b{min-height:0}
.ob-mono{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.12),rgba(0,0,0,.18));border:1.5px solid color-mix(in srgb,var(--fx) 60%,transparent);box-shadow:inset 0 0 0 4px rgba(0,0,0,.14),0 8px 18px -8px rgba(0,0,0,.6)}
.ob-mono span{font:700 calc(40px*var(--fz))/1 var(--f-d);font-variation-settings:"opsz" 144;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));transform:translateY(1px)}
.ob-cover h1{font:var(--dw) calc(42px*var(--fz))/1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);text-transform:var(--dtt);color:var(--hero-ink)}
.ob-cover p{margin-top:6px;font:500 calc(15px*var(--fz))/1.35 var(--f-b);color:color-mix(in srgb,var(--hero-ink) 78%,transparent)}
.ob-feats{list-style:none;margin:0;padding:16px 0 0;border-top:1px solid color-mix(in srgb,var(--hero-ink) 16%,transparent);display:flex;flex-direction:column;gap:11px}
.ob-feats li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;font:500 calc(15px*var(--fz))/1.35 var(--f-b);color:color-mix(in srgb,var(--hero-ink) 92%,transparent)}
.ob-feats svg{width:21px;height:21px;color:var(--fx)}
.wiz-bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;box-shadow:var(--well)}
.wiz-bar i{display:block;height:100%;background:var(--foil);border-radius:9px;transition:width .35s var(--ease)}
.wiz-b{display:flex;flex-direction:column;gap:13px;min-height:220px;animation:rise .35s var(--ease) both}
.wiz-q{font:var(--dw) calc(32px*var(--fz))/1.1 var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);text-transform:var(--dtt);color:var(--ink)}
.wiz-q2{font:var(--dw2) calc(19px*var(--fz)) var(--f-d);letter-spacing:var(--dt);font-stretch:var(--dst);margin-top:8px}
.wiz-nav{display:flex;justify-content:space-between;gap:10px}
.wiz-nav .btn.pri{min-width:150px}
.wiz-alt{align-self:center}
.wiz-brand{display:flex;align-items:center;gap:10px;color:var(--accent)}
.wiz-brand b{font:var(--dw) calc(20px*var(--fz)) var(--f-d);font-stretch:var(--dst)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:15px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;box-shadow:var(--hi),var(--sh1);transition:transform .14s var(--ease);min-width:0}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.14),transparent 60%),var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -12px color-mix(in srgb,var(--hero-a) 85%,transparent)}
.opt[aria-pressed="true"] .fc-ic{background:rgba(255,255,255,.12);color:var(--fx)}
.opt[aria-pressed="true"] .fc-t span{color:var(--hero-ink);opacity:.85}

/* guía del ejercicio (hoja) */
.peek{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:16px;background:var(--accent-soft);color:var(--ink);margin-bottom:10px;font-size:calc(14.5px*var(--fz))}
.g-mus{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:calc(14px*var(--fz));color:var(--muted)}
.stage{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--edge);background:radial-gradient(110% 90% at 50% 0%,var(--surface),var(--surface-2) 80%);box-shadow:inset 0 2px 12px rgba(0,0,0,.05),var(--sh2)}
.stage-v{display:block;aspect-ratio:1.2}.stage-v svg{display:block;width:100%;height:100%}
.stage-map{position:absolute;top:10px;right:10px;display:flex;gap:1px;padding:6px 6px 4px;border-radius:14px;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--edge)}
.stage-map svg{width:30px;height:auto}
.stage-ctl{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--edge);background:color-mix(in srgb,var(--surface) 72%,transparent)}
.sbtn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -6px color-mix(in srgb,var(--accent) 75%,transparent);flex:none}
.sbtn svg.i{width:18px;height:18px}
.sbtn.sp{width:auto;height:38px;padding:0 13px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font:700 calc(13px*var(--fz)) var(--f-b);box-shadow:var(--sh1)}
.sbtn.sp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.stage-lab{margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 calc(13px*var(--fz)) var(--f-b);background:var(--surface);padding:8px 12px;border-radius:999px;border:1px solid var(--edge)}
.gsteps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;padding:12px 13px;border-radius:19px;border:1px solid var(--edge);background:var(--surface);cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s}
.gsteps li.on{background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--sh1)}
.gs-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:var(--dw) calc(16px*var(--fz)) var(--f-d);font-stretch:var(--dst);background:var(--surface-2);color:var(--ink-2);transition:background .25s,color .25s}
.gsteps li.on .gs-n{background:var(--hero);color:var(--fx);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.gsteps b{display:block;font:650 calc(14px*var(--fz)) var(--f-b);color:var(--accent)}
.gsteps p{font-size:calc(15.5px*var(--fz));margin-top:3px}
.gsteps+.fold{margin-top:12px}
.g2col{display:grid;gap:8px;margin-top:10px}
.cues,.errs{padding:13px 15px;border-radius:18px;border:1px solid var(--edge);background:var(--surface)}
.cues h3,.errs h3,.vars h3{display:flex;align-items:center;gap:8px;font:650 calc(16px*var(--fz)) var(--f-b);margin-bottom:7px}
.cues h3 svg.i{color:var(--good)}.errs h3 svg.i{color:var(--bad)}.vars h3 svg.i{color:var(--accent)}
.cues ul,.errs ul{margin:0;padding-left:18px;font-size:calc(15px*var(--fz));display:flex;flex-direction:column;gap:5px}
.tip{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:calc(14.5px*var(--fz));color:var(--ink-2);padding:11px 13px;border-radius:16px;background:var(--surface-2)}
.tip svg.i{color:var(--accent-2);width:18px;height:18px;margin-top:1px}
.btn.yt{width:100%;margin-top:12px}.btn.yt svg.i{color:var(--accent)}
.g-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g-note{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.g-note textarea{min-height:64px}
.vars{margin-top:18px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.var{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 10px 8px 8px;border-radius:19px;border:1px solid var(--edge);background:var(--surface)}
.var.on{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.var-th{width:76px;height:64px;border-radius:14px}
.var-t{min-width:0;display:flex;flex-direction:column}
.var-t b{font:650 calc(15px*var(--fz))/1.25 var(--f-b)}
.hist2{margin-top:18px;padding:15px;border-radius:21px;border:1px solid var(--edge);background:var(--surface);scroll-margin-top:12px}
.hist2 h3{display:flex;align-items:center;gap:8px;font:650 calc(16px*var(--fz)) var(--f-b);margin-bottom:9px}
.hist2 h3 svg.i{color:var(--accent-2)}
.hst{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.hst>div{display:flex;flex-direction:column;gap:2px}
.hst .l{display:inline-flex;align-items:center;font-size:calc(13.5px*var(--fz));color:var(--muted)}
.hst b{font:var(--dw) calc(32px*var(--fz))/1.05 var(--f-d);letter-spacing:-.01em;font-stretch:var(--dst);color:var(--ink);font-variant-numeric:lining-nums}
.spark{width:150px;height:46px;flex:none}
.spark path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--fx);stroke:var(--accent);stroke-width:2}

['Músculo estirado','Prioriza ejercicios y rangos donde el músculo trabaja estirado: curl femoral sentado, tríceps sobre la cabeza, press inclinado profundo, talones con pausa abajo.','Varios ensayos encuentran más crecimiento entrenando en longitudes musculares largas. Los parciales en estiramiento rinden igual o más que el rango completo y claramente más que los parciales cortos.',[['Maeo et al. 2021 · Med Sci Sports Exerc (curl sentado)','https://doi.org/10.1249/MSS.0000000000002523'],['Maeo et al. 2023 · Eur J Sport Sci (tríceps sobre la cabeza)','https://doi.org/10.1080/17461391.2022.2100279'],['Wolf et al. 2023 · Int J Strength Cond (rango de movimiento)','https://doi.org/10.47206/ijsc.v3i1.182'],['Kassiano et al. 2023 · J Strength Cond Res (gemelos)','https://pubmed.ncbi.nlm.nih.gov/?term=Kassiano+gastrocnemius+partial+range+long+muscle+lengths']]],
['Carga y repeticiones','6–10 reps en básicos y 10–20 en aislamientos.','Con series cerca del fallo, cargas desde ~30 % del 1RM producen una hipertrofia parecida; las cargas altas ganan en fuerza máxima.',[['Schoenfeld et al. 2017 · J Strength Cond Res','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+low-+vs+high-load+resistance+training+meta-analysis']]],
['Descanso','2–3 min en básicos, 75–90 s o más en aislamientos.','Descansar más de 60 s da un beneficio pequeño, probablemente porque mantienes el volumen de carga; más allá de 90 s no se detectan diferencias claras.',[['Singer et al. 2024 · Front Sports Act Living','https://doi.org/10.3389/fspor.2024.1429789']]],
['Frecuencia','Cada músculo 2 veces por semana.','Con el volumen igualado, la frecuencia influye poco en el tamaño; repartir las series mejora la calidad de cada una y ayuda a la fuerza.',[['Schoenfeld et al. 2016 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+2016+resistance+training+frequency+hypertrophy+meta-analysis'],['Pelland et al. 2026 · Sports Med','https://sportrxiv.org/index.php/server/preprint/view/460']]],
['Tamaño del superávit','Si haces superávit, que sea pequeño: +5–10 % de tus calorías y ~0,25 % de tu peso por semana.','Con superávits de 5 % y 15 % la ganancia muscular fue parecida; subir de peso más rápido sumó sobre todo grasa.',[['Helms et al. 2023 · Sports Med Open 9:102','https://doi.org/10.1186/s40798-023-00651-y'],['Iraki et al. 2019 · Sports 7:154','https://doi.org/10.3390/sports7070154']]],
['Recomposición','Con más grasa y poca experiencia puedes ganar músculo comiendo en mantenimiento o en un ligero déficit.','Está bien documentada en principiantes y personas con sobrepeso, y también aparece en entrenados que comen proteína alta y progresan en el gym.',[['Barakat et al. 2020 · Strength Cond J 42(5)','https://doi.org/10.1519/SSC.0000000000000584']]],
['Proteína','1,6–2,2 g/kg al día repartidos en 3–5 comidas.','El beneficio sobre la masa muscular se estabiliza cerca de 1,6 g/kg (hasta ~2,2). Con más grasa corporal se calcula sobre un peso de referencia. El total diario manda: una comida grande también se aprovecha.',[['Morton et al. 2018 · Br J Sports Med','https://doi.org/10.1136/bjsports-2017-097608'],['Trommelen et al. 2023 · Cell Rep Med','https://doi.org/10.1016/j.xcrm.2023.101324']]],
['Creatina','3–5 g de creatina monohidrato al día, sin fase de carga.','Es el suplemento con más evidencia para fuerza y masa magra, y es seguro en personas sanas.',[['Kreider et al. 2017 · J Int Soc Sports Nutr','https://doi.org/10.1186/s12970-017-0173-z']]],
['Sueño','7–9 h por noche.','Una sola noche sin dormir redujo la síntesis de proteína muscular un 18 % en un ensayo controlado.',[['Lamon et al. 2021 · Physiol Rep','https://doi.org/10.14814/phy2.14660']]],
['Cardio','Sí puedes hacerlo: 8–10 mil pasos o 2–3 sesiones moderadas por semana.','Combinar cardio y pesas no frena la hipertrofia ni la fuerza máxima; puede restar algo de potencia si van en la misma sesión.',[['Schumann et al. 2022 · Sports Med','https://doi.org/10.1007/s40279-021-01587-7']]],
['Calibra tu RIR','Llega al fallo en algún aislamiento de vez en cuando para ajustar tu percepción.','Solemos subestimar cuántas repeticiones nos quedan, sobre todo lejos del fallo; la estimación mejora cerca de él.',[['Halperin et al. 2022 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Halperin+accuracy+predicting+repetitions+to+task+failure']]],
['Prioridad y orden','Los músculos de tu objetivo llevan más series y van primero en cada sesión.','El volumen semanal es lo que más pesa en el crecimiento de cada músculo. El orden casi no cambia la hipertrofia, pero lo que entrenas primero gana más fuerza porque llegas fresco.',[['Nunes et al. 2021 · Eur J Sport Sci 21(2):149','https://doi.org/10.1080/17461391.2020.1733672'],['Pelland et al. 2026 · Sports Med','https://sportrxiv.org/index.php/server/preprint/view/460']]],
['Variantes','Cambiar un ejercicio por su variante está bien; rotarlos cada sesión, no.','Variar de forma planificada (ángulos distintos para un mismo músculo) puede mejorar el desarrollo por regiones; cambiar al azar o muy seguido dificulta progresar en carga.',[['Kassiano et al. 2022 · J Strength Cond Res 36(6):1753','https://doi.org/10.1519/JSC.0000000000004258']]],
['Tempo','Baja controlado (~2 s) y sube con intención; sin repeticiones ultralentas.','Duraciones de repetición entre 0,5 y 8 s producen hipertrofia similar.',[['Schoenfeld et al. 2015 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+repetition+duration+hypertrophy+meta-analysis']]]];

function mergeS(srv){const out=srv.filter(s=>!S.dead.has(s.id)).map(s=>{const l=S.loc.get(s.id);return l&&(l.v||0)>(s.v||0)?l:s});for(const[id,l]of S.loc)if(!S.dead.has(id)&&!out.some(s=>s.id===id))out.push(l);return out.sort((a,b)=>(a.ts||0)-(b.ts||0))}
function mergeW(srv){const out=srv.filter(w=>!S.dead.has(w.id)&&w.kg>0).map(w=>{const l=S.wloc.get(w.id);return l&&(l.v||0)>(w.v||0)?l:w});for(const[id,l]of S.wloc)if(!S.dead.has(id)&&!out.some(w=>w.id===id))out.push(l);return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function syncCur(){if(S.cur){const f=S.sessions.find(s=>s.id===S.cur.id);if(f&&f!==S.cur&&(f.v||0)>(S.cur.v||0))S.cur=f;if(S.cur&&(S.cur.done||S.dead.has(S.cur.id)||(S.mode==='local'&&!f)))S.cur=null;if(S.cur)return}
 S.cur=[...S.sessions].reverse().find(s=>!s.done)||null}
function touchS(s){s.v=stamp(s);S.loc.set(s.id,s);const i=S.sessions.findIndex(x=>x.id===s.id);if(i>=0)S.sessions[i]=s;else S.sessions.push(s);store.put('sessions',s.id,()=>S.dead.has(s.id)?null:s)}

const snap=()=>({prof:S.prof,sessions:S.sessions,weights:S.weights,tomb:S.tomb||{}});
const pack=d=>({app:'bitacora',schema:1,at:Date.now(),prof:d.prof,sessions:d.sessions,weights:d.weights,tomb:d.tomb||{}});
const sig=d=>[(d.prof&&d.prof.v)||0,(d.sessions||[]).map(s=>s.id+':'+(s.v||0)).sort().join(),(d.weights||[]).map(w=>w.id+':'+(w.v||0)).sort().join(),Object.keys(d.tomb||{}).sort().map(k=>k+':'+d.tomb[k]).join()].join('|');
function mergeData(a,b){const tomb={...(a.tomb||{})};for(const[k,v]of Object.entries(b.tomb||{}))if(!(tomb[k]>=v))tomb[k]=v;
 const pick=(xs,ys)=>{const m=new Map();for(const r of[...(xs||[]),...(ys||[])]){if(!r||!r.id)continue;const c=m.get(r.id);if(!c||(r.v||0)>(c.v||0))m.set(r.id,r)}return[...m.values()].filter(r=>!(tomb[r.id]>=(r.v||0)))};
 const pa=a.prof||{},pb=b.prof||{};
 return{prof:(pb.v||0)>(pa.v||0)?pb:pa,sessions:pick(a.sessions,b.sessions).sort((x,y)=>(x.ts||0)-(y.ts||0)),weights:pick(a.weights,b.weights).filter(w=>w.kg>0).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0),tomb}}
function applyData(m){S.prof={...DEF,...m.prof};S.sessions=m.sessions;S.weights=m.weights;S.tomb=m.tomb||{};syncCur();if(S.mode==='local')store.saveLocal(true);requestRender()}
async function importData(o){if(!o||o.app!=='bitacora'||!Array.isArray(o.sessions)||!Array.isArray(o.weights))throw new Error('El archivo no es un respaldo de la Bitácora.');
 const before=sig(snap()),m=mergeData(snap(),o),addS=m.sessions.length-S.sessions.length,addW=m.weights.length-S.weights.length,clean=x=>JSON.parse(JSON.stringify(x));
 if(S.mode==='db'){const os=new Map(S.sessions.map(s=>[s.id,s.v||0])),ow=new Map(S.weights.map(w=>[w.id,w.v||0]));
  for(const s of m.sessions)if(!os.has(s.id)||os.get(s.id)<(s.v||0)){S.loc.set(s.id,s);await store.root.collection('sessions').doc(s.id).set(clean(s))}
  for(const w of m.weights)if(!ow.has(w.id)||ow.get(w.id)<(w.v||0)){S.wloc.set(w.id,w);await store.root.collection('weights').doc(w.id).set(clean(w))}
  if((m.prof.v||0)>(S.prof.v||0)){S.prof={...DEF,...m.prof};await store.root.set(clean(S.prof))}
  S.sessions=mergeS(m.sessions);S.weights=mergeW(m.weights);syncCur();requestRender()}
 else{applyData(m);SY.schedule(400)}
 return{changed:sig(m)!==before,addS,addW}}

 async connect(token){token=String(token||'').replace(/\s+/g,'');if(!token){this.err='Pega tu token de GitHub en el campo.';syncUI();return}
  if(!/^(ghp_|github_pat_|gho_|ghu_)/.test(token)&&token.length<30){this.err='Eso no parece un token. Crea uno con el enlace de arriba: empieza con «ghp_». No uses tu contraseña de GitHub.';syncUI();return}

   let gist=null;for(let p=1;p<=5&&!gist;p++){const r=await this.api('/gists?per_page=100&page='+p,{token});if(r.status===403||r.status===404)throw new Error('El token no tiene el permiso «gist». Crea uno nuevo con ese permiso.');if(!r.ok)throw new Error('GitHub respondió '+r.status+'.');const a=await r.json();gist=a.find(g=>g.description===GD&&g.files&&g.files[GF])||null;if(a.length<100)break}
   let created=false;if(!gist){const r=await this.newGist(token);if(!r.ok)throw new Error(r.status===403||r.status===404?'El token no puede crear gists: necesita el permiso «gist».':'No se pudo crear el gist ('+r.status+').');gist=await r.json();created=true}
   this.cfg={token,gist:gist.id,login:me.login||'',last:created?Date.now():0};this.save();this.state=created?'ok':'idle';this.busy=false;
   toast(created?'Sincronización activada':'Conectado: trayendo tus datos…');if(!created)await this.run();else syncUI()}
  catch(e){this.busy=false;this.err=e&&e.message&&!/fetch|network|load failed/i.test(e.message)?e.message:'No se pudo conectar con GitHub. Revisa tu conexión.';this.state=this.cfg?'error':'off';syncUI()}},
 disconnect(){clearTimeout(this.t);this.cfg=null;this.save();this.state='off';this.err='';syncUI()},

   if(r.status===404){const c=await this.newGist();if(!c.ok)throw new Error('No se encontró el gist de sincronización.');this.cfg.gist=(await c.json()).id;this.save()}
   else{if(!r.ok)throw new Error(r.status===403||r.status===429?'GitHub limitó las peticiones; se reintentará más tarde.':'GitHub respondió '+r.status+'.');
    const g=await r.json(),f=g.files&&g.files[GF];let txt=f?f.content:null;if(f&&f.truncated&&f.raw_url)txt=await(await fetch(f.raw_url)).text();

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:radial-gradient(900px 520px at 105% -8%,color-mix(in srgb,var(--accent) 11%,transparent),transparent 62%),radial-gradient(720px 460px at -12% 4%,color-mix(in srgb,var(--accent-2) 9%,transparent),transparent 58%),var(--bg);background-repeat:no-repeat;color:var(--ink);font:16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-block:0 calc(var(--navh) + 22px)}
body.timing{padding-block:0 calc(var(--navh) + 112px)}
.in{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}p{margin:0}a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
nav.tabs,.btn,.seg,.chk,.ibtn,.meso,.daypick,.fc,.mp,.chipb,.sbtn,.thumb,.var-th{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.small{font-size:13.5px}.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 10.5px/1.3 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inl svg.i{width:16px;height:16px;vertical-align:-3px}

/* cabecera de cristal */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid color-mix(in srgb,var(--line-2) 85%,transparent)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 21px/1 var(--f-d);letter-spacing:-.03em;background:linear-gradient(100deg,var(--accent) 20%,color-mix(in srgb,var(--accent) 45%,var(--accent-2)));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 color-mix(in srgb,var(--accent) 22%,transparent))}
.brand span{font:600 11px var(--f-m);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span.named{font:600 14px var(--f-b);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;font:600 11.5px var(--f-m);padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent)}
.ibtn{position:relative;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));display:grid;place-items:center;color:var(--ink-2);flex:none;padding:0;box-shadow:var(--hi),0 2px 0 var(--line);transition:transform .12s}
.ibtn:active{transform:translateY(2px);box-shadow:var(--hi)}
.ibtn.sm{width:32px;height:32px;border-radius:10px}.ibtn.sm svg.i{width:16px;height:16px}
.ibtn .dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--accent)}.dot.err{background:var(--bad)}.dot.off{background:var(--muted)}

/* estructura */
main{display:flex;flex-direction:column;gap:18px;padding-block:16px 8px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:76px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.sec-h h2{display:flex;align-items:center;gap:10px;font:700 19px/1.15 var(--f-d);letter-spacing:-.02em;color:var(--accent)}
.h-ic{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.15),0 5px 12px -4px color-mix(in srgb,var(--hero-a) 70%,transparent);flex:none}
.h-ic svg.i{width:17px;height:17px}
.card{position:relative;background:linear-gradient(180deg,var(--card-top),var(--surface) 70%);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--hi),var(--sh2)}
b.ttl{display:flex;align-items:center;gap:8px;font:700 14.5px/1.2 var(--f-d);letter-spacing:-.01em;margin-bottom:6px}
b.ttl svg.i{color:var(--accent);width:18px;height:18px}
.lbl,.field label{font-size:13px;color:var(--ink-2);font-weight:600}
.foot{text-align:center;padding:4px 0}

/* botones con volumen */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 15px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));color:var(--ink);font:600 14.5px/1.1 var(--f-b);text-decoration:none;box-shadow:var(--hi),0 2px 0 var(--line),var(--sh1);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:var(--hi),0 0 0 var(--line)}
.btn svg.i{width:17px;height:17px}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent) 62%);border-color:color-mix(in srgb,var(--accent) 80%,#000);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 0 color-mix(in srgb,var(--accent) 55%,#000),0 10px 20px -6px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.pri:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:transparent;box-shadow:none;border-color:color-mix(in srgb,var(--line) 85%,transparent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));font:600 13.5px var(--f-b);color:var(--ink-2);box-shadow:var(--hi),0 2px 0 var(--line);transition:transform .12s}
.seg button:active{transform:translateY(2px);box-shadow:none}
.seg button[aria-pressed="true"]{background:var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 0 color-mix(in srgb,var(--hero-a) 70%,#000),0 6px 14px -6px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.seg.sm button{min-height:32px;padding:0 11px;font-size:12.5px}

/* saludo y motivación */
.greet{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:16px 16px 16px 18px;border-radius:24px;border:1px solid var(--line-2);background:radial-gradient(130% 150% at 0% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 58%),radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 60%),linear-gradient(180deg,var(--card-top),var(--surface));box-shadow:var(--hi),var(--sh2)}
.g-txt{min-width:0}
.g-hi{font:600 16px/1.25 var(--f-d);letter-spacing:-.02em;color:var(--ink)}
.g-hi b{color:var(--accent);font-weight:800}
.g-mot{font-size:15px;color:var(--ink-2);margin-top:5px}
.g-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.g-stats.wide{margin-top:0}
.g-st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line-2);padding:4px 10px 4px 7px;border-radius:999px}
.g-st svg.i{width:15px;height:15px;color:var(--accent)}
.g-st b{font:700 12.5px var(--f-m);color:var(--ink)}
.ring{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 3px 5px color-mix(in srgb,var(--accent) 30%,transparent))}
.ring .rt{fill:none;stroke:color-mix(in srgb,var(--accent) 15%,transparent);stroke-width:7}
.ring .rv{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .6s var(--ease)}
.ring span{position:relative;display:flex;flex-direction:column;line-height:1}
.ring b{font:800 14px var(--f-d);letter-spacing:-.04em}
.ring i{font:600 7.5px var(--f-m);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px;max-width:52px}
.ring.big{width:80px;height:80px}.ring.big b{font-size:16px}
.newc{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 60%),linear-gradient(180deg,var(--card-top),var(--surface));display:flex;flex-direction:column;gap:8px}
.newc h3{font:700 17px/1.2 var(--f-d);letter-spacing:-.02em}

/* ficha de la sesión: volumen, brillo y título en relieve */
.ficha{position:relative;overflow:hidden;border-radius:28px;color:var(--hero-ink);background:radial-gradient(140% 120% at 100% 0%,color-mix(in srgb,var(--hero-ink) 15%,transparent),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(0,0,0,.22),transparent 62%),var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.18),var(--sh3)}
.ficha::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 32%,rgba(255,255,255,.2) 46%,transparent 58%);transform:translateX(-110%);pointer-events:none}
main.enter .ficha::before{animation:shine 1.6s .25s var(--ease) both}
.ficha::after{content:"";position:absolute;width:240px;height:240px;right:-90px;bottom:-120px;border-radius:50%;border:26px solid rgba(255,255,255,.06);pointer-events:none}
.f-body{position:relative;padding:18px 18px 18px;display:flex;flex-direction:column;gap:12px}
.f-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.f-tt{min-width:0}
.f-eye{font:600 10.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.f-name{font:800 clamp(27px,7.6vw,42px)/1.04 var(--f-d);text-transform:uppercase;letter-spacing:-.02em;margin-top:6px;text-shadow:0 1px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.16),0 3px 0 rgba(0,0,0,.12),0 10px 18px rgba(0,0,0,.3);overflow-wrap:anywhere}
.f-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ftag{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-b);padding:4px 10px 4px 7px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2)}
.ftag svg.i{width:15px;height:15px;color:var(--fx)}
.ficha .ring .rt{stroke:rgba(255,255,255,.18)}.ficha .ring .rv{stroke:var(--fx)}.ficha .ring svg{filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}.ficha .ring i{color:inherit;opacity:.8}
.meter{height:7px;border-radius:999px;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--fx) 70%,#fff),var(--fx));border-radius:999px;transition:width .5s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--fx) 60%,transparent)}
.f-meta{font-size:14px;opacity:.9}
.ficha .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.2)}
.ficha .btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--fx) 80%,#fff),var(--fx) 60%);border-color:transparent;color:var(--fx-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 color-mix(in srgb,var(--fx) 50%,#000),0 10px 20px -8px rgba(0,0,0,.5)}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick button{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--hero-ink);font:600 13px var(--f-b)}
.daypick button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-a)}

/* tarjeta de ejercicio */
.ex{position:relative;background:linear-gradient(180deg,var(--card-top),var(--surface) 60%);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;box-shadow:var(--hi),var(--sh2)}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--pt),color-mix(in srgb,var(--pt) 25%,transparent))}
.ex.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 14px 8px 16px}
.ex-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13.5px var(--f-m);color:var(--ink);background:radial-gradient(circle at 32% 28%,var(--card-top),color-mix(in srgb,var(--pt) 22%,var(--surface)) 72%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pt) 75%,var(--surface)),inset 0 -3px 4px rgba(0,0,0,.08),0 4px 10px -4px color-mix(in srgb,var(--pt) 70%,transparent)}
.ex.done .ex-n{background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--good) 65%,#fff),var(--good) 70%);color:var(--surface);box-shadow:inset 0 -3px 4px rgba(0,0,0,.18),0 4px 10px -4px color-mix(in srgb,var(--good) 80%,transparent)}
.ex-n svg.i{width:18px;height:18px;stroke-width:2.6}
.ex-tt{min-width:0}
.ex-h h3{font:700 15.5px/1.25 var(--f-d);letter-spacing:-.02em}
.ex-m{font-size:13px;color:var(--muted);margin-top:2px}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pt);margin-right:6px;vertical-align:1px;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--pt) 22%,transparent)}
.thumb,.var-th{position:relative;display:block;width:86px;height:72px;padding:0;border-radius:16px;border:1px solid var(--line-2);background:radial-gradient(120% 100% at 50% 0%,var(--card-top),var(--surface-2) 80%);box-shadow:var(--well),var(--sh1);overflow:hidden;flex:none;transition:transform .15s}
.thumb:active,.var-th:active{transform:scale(.95)}
.th-svg,.th-svg svg{display:block;width:100%;height:100%}
.th-play{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 8px -2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.th-play svg.i{width:12px;height:12px;margin-left:1px}
.scheme{font:500 12.5px var(--f-m);color:var(--ink-2);padding:0 14px 0 16px}
.hint{margin:9px 14px 0 16px;padding:9px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;box-shadow:var(--well)}
.hint b{color:var(--ink)}.hint.up{background:var(--good-soft)}.hint.down{background:var(--warn-soft)}
.warm{margin:7px 14px 0 16px;font-size:12.5px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0 16px}
.panel{margin:9px 14px 0 16px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.sets{padding:12px 14px 14px 16px;display:flex;flex-direction:column;gap:7px}
.set,.set-h{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 60px 48px;gap:6px;align-items:center}
.set-h{font:600 10px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.set-h span{text-align:center}
.set .n{font:600 13px var(--f-m);color:var(--muted);text-align:center}
.set input,.set select{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);font:600 16px var(--f-m);text-align:center;text-align-last:center;padding:0 4px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;box-shadow:var(--well);transition:border-color .15s,box-shadow .15s}
.set input:focus,.set select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--well),0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.chk{height:46px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));display:grid;place-items:center;color:var(--muted);padding:0;box-shadow:var(--hi),0 3px 0 var(--line);transition:transform .12s}
.chk:active{transform:translateY(3px);box-shadow:var(--hi)}
.chk svg.i{stroke-width:2.6}
.set.ok input,.set.ok select{background:var(--good-soft);border-color:transparent;color:var(--ink);opacity:1;box-shadow:none}
.set.ok .chk{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 78%,#fff),var(--good) 70%);border-color:transparent;color:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 color-mix(in srgb,var(--good) 55%,#000)}
.set.just .chk{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
.set.just input{animation:flash 1s ease-out}
.plates{display:flex;align-items:center;gap:2px;min-height:70px;overflow-x:auto}
.plates .bar{flex:none;width:36px;height:8px;background:var(--p1);border-radius:2px}
.plates .colr{flex:none;width:6px;height:24px;background:var(--p1);border-radius:2px;margin-right:2px}
.plates .sleeve{flex:none;width:40px;height:12px;background:var(--p1);border-radius:0 3px 3px 0}
.pl{flex:none;display:block;border-radius:4px;height:var(--h);width:var(--w);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.25),inset -2px 0 0 rgba(0,0,0,.18)}
.p25{background:var(--p25)}.p20{background:var(--p20)}.p15{background:var(--p15)}.p10{background:var(--p10)}.p5{background:var(--p5)}.p2{background:var(--p2)}.p1{background:var(--p1)}

/* resumen de sesión (festejo) */
.intro .steps{margin:6px 0 10px}
.sumh{font:800 22px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:-.02em;margin:4px 0}
.card.sum{background:radial-gradient(130% 120% at 100% 0%,rgba(255,255,255,.16),transparent 55%),var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),var(--sh3);overflow:hidden}
.sum .eyebrow{color:color-mix(in srgb,var(--hero-ink) 80%,transparent)}
.sum-top{display:flex;gap:14px;align-items:center}
.sum-medal,.medal{display:grid;place-items:center;border-radius:50%;flex:none}
.sum-medal{width:58px;height:58px;color:var(--fx-ink);background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--fx) 35%,#fff),var(--fx) 55%,color-mix(in srgb,var(--fx) 65%,#000));box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.6),0 0 0 4px rgba(255,255,255,.15),0 10px 20px -6px rgba(0,0,0,.45);animation:medal 1s var(--ease) both}
.sum-medal svg.i{width:28px;height:28px}
.sum-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin:14px 0 6px}
.sum-stats span{display:flex;flex-direction:column;gap:2px;font-size:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.sum-stats b{font:800 21px/1 var(--f-d);letter-spacing:-.03em;color:var(--fx)}
.sum .mono{color:var(--fx)}
.sum-badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sbadge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.sbadge .medal{width:30px;height:30px;color:var(--fx-ink);background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--fx) 35%,#fff),var(--fx) 60%)}
.sbadge .medal svg.i{width:16px;height:16px}
.sbadge small{display:block;font:600 9.5px var(--f-m);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.sbadge b{font:700 13px var(--f-d)}
.sum-mot{font-size:15px;margin:8px 0 12px;opacity:.95}
.sum .btn{background:rgba(255,255,255,.1);color:var(--hero-ink);border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.2)}
.sum .btn.ghost{background:transparent;box-shadow:none}

/* rutina a medida */
.ai{display:flex;flex-direction:column;gap:12px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent-2) 15%,transparent),transparent 55%),radial-gradient(120% 120% at 0% 100%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%),linear-gradient(180deg,var(--card-top),var(--surface));border-color:color-mix(in srgb,var(--accent) 25%,var(--line-2))}
.ai-h{display:flex;gap:12px;align-items:center}
.ai-h b{display:block;font:700 15.5px/1.2 var(--f-d);letter-spacing:-.02em}
.ai-h .small{display:block;margin-top:2px}
.ai-orb{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--hero-ink);background:var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.2),0 8px 18px -6px color-mix(in srgb,var(--hero-a) 80%,transparent);flex:none;animation:orb 5s ease-in-out infinite}
.ai-orb svg.i{width:22px;height:22px;color:var(--fx)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink-2);border-radius:999px;padding:7px 12px;font:500 13.5px var(--f-b)}
.chipb:active{background:var(--accent-soft)}
.ai-res{border-radius:16px;padding:12px 14px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1);animation:rise .35s var(--ease) both}
.ai-done{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--good-soft);color:var(--ink);font-size:14px}
.ai-done svg.i{color:var(--good)}.ai-done span{flex:1}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;padding:12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));color:var(--ink);box-shadow:var(--hi),0 3px 0 var(--line),var(--sh1);min-width:0;transition:transform .14s}
.fc:active{transform:translateY(3px);box-shadow:var(--hi)}
.fc-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 14%,transparent)}
.fc-t b{display:block;font:700 13.5px/1.2 var(--f-d);letter-spacing:-.02em}
.fc-t span{display:block;font-size:12.5px;line-height:1.3;color:var(--muted);margin-top:3px}
.fc[aria-pressed="true"]{background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.16),transparent 60%),var(--hero);color:var(--hero-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 color-mix(in srgb,var(--hero-a) 65%,#000),0 12px 24px -10px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.fc[aria-pressed="true"] .fc-ic{background:rgba(255,255,255,.14);color:var(--fx);box-shadow:none}
.fc[aria-pressed="true"] .fc-t span{color:var(--hero-ink);opacity:.85}
.fc .sug{position:absolute;top:9px;right:9px}
.mpri{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.mp{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));color:var(--ink);text-align:left;min-width:0;box-shadow:var(--hi),0 2px 0 var(--line);transition:transform .12s}
.mp:active{transform:translateY(2px);box-shadow:none}
.mp span{font:600 14px/1.2 var(--f-b)}
.mp i{font:600 9.5px var(--f-m);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mp.p2{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent) 65%);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 color-mix(in srgb,var(--accent) 55%,#000),0 8px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.mp.p2 i{color:var(--accent-ink);opacity:.85}
.mp.p0{background:var(--surface-2);border-style:dashed;color:var(--ink-2);box-shadow:none}
.mp.own::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent-2)}
.why .bul{font-size:14px}
.field small{font-size:12.5px;color:var(--muted)}

/* guía del ejercicio (hoja inferior) */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-back{position:absolute;inset:0;background:rgba(12,4,8,.52);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
.sheet.on .sh-back{opacity:1}
.sh-box{position:relative;width:min(660px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 12px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:radial-gradient(120% 40% at 50% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%),var(--bg);border-radius:30px 30px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -24px 60px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(102%);transition:transform .34s var(--ease);outline:none}
.sheet.on .sh-box{transform:none}
.sh-grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
html.sheet-open,html.sheet-open body{overflow:hidden}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.sh-tt{min-width:0}
.sh-h h2{font:800 21px/1.15 var(--f-d);letter-spacing:-.03em;margin-top:4px}
.peek{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:16px;background:var(--accent-soft);color:var(--ink);margin-bottom:10px;font-size:14px}
.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line-2);background:radial-gradient(110% 90% at 50% 0%,var(--card-top),var(--surface-2) 78%);box-shadow:inset 0 2px 12px rgba(0,0,0,.06),var(--sh2)}
.stage-v{display:block;aspect-ratio:1.2}.stage-v svg{display:block;width:100%;height:100%}
.stage-ctl{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.sbtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -4px color-mix(in srgb,var(--accent) 70%,transparent);flex:none}
.sbtn svg.i{width:18px;height:18px}
.sbtn.sp{width:auto;height:36px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--ink);border:1px solid var(--line);font:700 12px var(--f-m);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--sh1)}
.sbtn.sp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.stage-lab{margin-left:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--f-m);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gsteps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gsteps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:11px 12px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s}
.gsteps li.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--sh1)}
.gs-n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-m);background:var(--surface-2);color:var(--ink-2);transition:background .25s,color .25s}
.gsteps li.on .gs-n{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 10px -4px color-mix(in srgb,var(--accent) 80%,transparent)}
.gsteps b{display:block;font:700 10.5px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.gsteps p{font-size:15px;margin-top:3px}
.g2col{display:grid;gap:8px;margin-top:10px}

/* componentes generales */

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

.note{border-radius:var(--r);padding:12px 14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1)}

.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0}
.hero b{font:800 48px/1 var(--f-d);letter-spacing:-.05em;background:linear-gradient(100deg,var(--ink),color-mix(in srgb,var(--ink) 55%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}

.mbar{display:flex;gap:2px;height:14px;margin:12px 0 8px;border-radius:6px;overflow:hidden;box-shadow:var(--well)}

.mleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key i.ln{height:2px;width:14px;border-radius:2px}.key i.dash{height:0;width:14px;border-top:2px dashed var(--ink-2);border-radius:0}.key i.dot{border-radius:50%}.key i.tgt{width:3px;height:12px;border-radius:2px;background:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:linear-gradient(180deg,var(--card-top),var(--surface));border:1px solid var(--line-2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:var(--hi),var(--sh1)}
.approx{font-family:var(--f-b);font-weight:500;margin-right:1px}.stat .l{font-size:12.5px;color:var(--muted)}.stat .v{font:700 19px/1.2 var(--f-d);letter-spacing:-.03em}.stat .d{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1.3 var(--f-b);padding:3px 9px;border-radius:999px;white-space:nowrap}

.pill.new{background:var(--hero);color:var(--hero-ink);box-shadow:0 3px 8px -3px color-mix(in srgb,var(--hero-a) 80%,transparent);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}

.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 10.5px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:0 12px;font:16px var(--f-b);width:100%;min-width:0;box-shadow:var(--well);transition:border-color .15s,box-shadow .15s}

.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:14.5px}
.dl li:first-child{border-top:0}
.dl li>span:first-child{min-width:0}
.dl li .mono{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.exl{appearance:none;border:0;background:none;padding:2px 0;margin:0;text-align:left;color:var(--ink);font:500 14.5px/1.35 var(--f-b);min-width:0;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:4px}

.day.next{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--hi),0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent),var(--sh2)}
.meso{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.meso button{border:1px solid var(--line);background:linear-gradient(180deg,var(--card-top),var(--surface-2));border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;color:var(--ink);box-shadow:var(--hi),0 2px 0 var(--line)}

.meso b{font:800 15px/1 var(--f-d);letter-spacing:-.03em}
.meso span.t{font:500 9.5px var(--f-m);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.meso button[aria-pressed="true"]{background:var(--hero);border-color:transparent;color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 color-mix(in srgb,var(--hero-a) 65%,#000),0 8px 16px -8px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.meso button[aria-pressed="true"] span.t{color:inherit;opacity:.85}

.meso button[aria-pressed="true"] .iv i{background:var(--fx)}
.vb{display:flex;flex-direction:column;gap:9px}

.vband{position:absolute;top:-3px;bottom:-3px;background:color-mix(in srgb,var(--good) 13%,transparent);border-inline:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.vplan{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--pt,var(--accent)) 26%,transparent);border-radius:0 6px 6px 0}
.vdone{position:absolute;left:0;top:3px;bottom:3px;background:linear-gradient(180deg,color-mix(in srgb,var(--pt,var(--accent)) 75%,#fff),var(--pt,var(--accent)));border-radius:0 5px 5px 0;box-shadow:0 2px 6px -2px color-mix(in srgb,var(--pt,var(--accent)) 70%,transparent)}
.vtgt{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);opacity:.75}
.vval{font:500 12px var(--f-m);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{fill:var(--muted);font:11px var(--f-m)}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .lbl{fill:var(--ink);font:600 12px var(--f-m)}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-m);padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:2;box-shadow:var(--sh2)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}

.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2);font-size:14.5px}
.hist li:first-child{border-top:0}

.refs a{font:12px var(--f-m);text-decoration:none}
.refs a:hover{text-decoration:underline}
.supp li{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.supp li:first-child{border-top:0}
.supp b{font-weight:600}
.field small.err,.err{color:var(--bad);font-size:13px;font-weight:500}
.ob{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

/* barra flotante */
nav.tabs{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30;max-width:560px;margin-inline:auto;border-radius:26px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:var(--hi),var(--sh3)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;max-width:none}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:20px;color:var(--muted);font:600 11px var(--f-b);min-width:0;transition:color .2s,background .25s,transform .15s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button[aria-current="page"]{color:var(--hero-ink);background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.2),transparent 60%),var(--hero);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 16px -6px color-mix(in srgb,var(--hero-a) 80%,transparent)}
.timer{position:fixed;left:0;right:0;bottom:calc(var(--navh) + 6px);z-index:29;pointer-events:none}
.t-box{pointer-events:auto;background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.14),transparent 55%),var(--hero);color:var(--hero-ink);border-radius:20px;padding:11px 13px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--sh3);animation:rise .35s var(--ease) both}
.t-time{font:700 30px/1 var(--f-m);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.t-lab{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bar{grid-column:1/-1;height:5px;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--fx);box-shadow:0 0 10px var(--fx)}
.t-b{grid-column:1/-1;display:flex;gap:6px}
.t-b button{flex:1;min-height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--hero-ink);font:600 13px var(--f-b)}
.upd{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:35;pointer-events:none}
.upd-box{pointer-events:auto;background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:600;box-shadow:var(--sh3)}
.upd-box button{border:0;border-radius:12px;min-height:36px;padding:0 14px;background:var(--fx);color:var(--fx-ink);font:700 13.5px var(--f-b)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 12px);z-index:65;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);padding:11px 16px;border-radius:16px;font:500 14px/1.35 var(--f-b);width:max-content;max-width:min(92vw,520px);box-shadow:var(--sh3);pointer-events:none;animation:toast .35s cubic-bezier(.2,.9,.3,1.25) both}
.toast.win{background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.16),transparent 55%),var(--hero);color:var(--hero-ink);padding-left:46px;font-weight:600}
.toast.win::before{content:"";position:absolute;left:12px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--fx) 40%,#fff),var(--fx) 60%);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
body.timing .toast{bottom:calc(var(--navh) + 122px)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* movimiento */
main.enter>*{animation:rise .45s var(--ease) both}
main.enter>:nth-child(2){animation-delay:.04s}main.enter>:nth-child(3){animation-delay:.08s}main.enter>:nth-child(4){animation-delay:.12s}main.enter>:nth-child(5){animation-delay:.16s}main.enter>:nth-child(6){animation-delay:.2s}main.enter>:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flash{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 45%,transparent)}to{box-shadow:0 0 0 0 transparent}}
@keyframes shine{to{transform:translateX(110%)}}
@keyframes orb{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes medal{0%{transform:scale(.4) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* tamaños */
@media (min-width:520px){.g2col{grid-template-columns:1fr 1fr}.focus{grid-template-columns:repeat(4,minmax(0,1fr))}.focus .fc{padding-top:14px}}
@media (min-width:700px){.hero b{font-size:58px}.thumb{width:104px;height:86px}}
@media (max-width:440px){.brand span:not(.named){display:none}.brand span{max-width:9rem}}
@media (max-width:370px){.chip{display:none}.thumb{width:72px;height:60px}.ring.big{width:70px;height:70px}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-padding-bottom:calc(var(--navh) + 24px)}
html:has(body.timing){scroll-padding-bottom:calc(var(--navh) + 130px)}
@media (min-width:900px){
 body{padding-left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px));padding-block:0 28px}
 body.timing{padding-block:0 120px}
 nav.tabs{top:12px;bottom:12px;left:calc(12px + env(safe-area-inset-left,0px));right:auto;width:var(--rail);max-width:none;margin:0}
 nav.tabs .in{grid-template-columns:1fr;align-content:start;gap:6px;padding:76px 8px 12px}
 nav.tabs button{padding:11px 0;font-size:11.5px}
 .timer{left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px));bottom:14px}
 .upd{left:calc(var(--rail) + 24px + env(safe-area-inset-left,0px))}
 .toast{left:calc(50% + var(--rail) / 2);bottom:18px}
 body.timing .toast{bottom:132px}
 .sheet{align-items:center;padding:24px}
 .sh-box{border-radius:30px;max-height:min(880px,calc(100vh - 48px));transform:translateY(24px) scale(.97);opacity:0;transition:transform .3s var(--ease),opacity .22s}
 .sheet.on .sh-box{transform:none;opacity:1}
 .sh-grab{display:none}
 .sh-box{padding-top:18px}
 .stage-v{aspect-ratio:auto;height:min(44vh,400px)}

const SCI=[
['Volumen','Empieza con ~10 series semanales por músculo y súbelas poco a poco dentro del mesociclo.','Más series dan más hipertrofia con rendimientos decrecientes; la fuerza se estanca antes que el tamaño. Las series indirectas cuentan, pero menos (aquí valen 0,5).',[['Pelland et al. 2026 · Sports Med (67 estudios)','https://sportrxiv.org/index.php/server/preprint/view/460'],['Schoenfeld, Ogborn y Krieger 2017 · J Sports Sci','https://doi.org/10.1080/02640414.2016.1210197']]],
['Cercanía al fallo','Termina cada serie a 0–3 repeticiones del fallo. Básicos un poco más lejos, aislamientos más cerca.','La hipertrofia aumenta a medida que la serie se acerca al fallo; la fuerza depende poco de ello. Ir siempre al fallo en básicos suma fatiga sin una ganancia clara.',[['Robinson et al. 2024 · Sports Med 54:2209','https://pubmed.ncbi.nlm.nih.gov/?term=Robinson+proximity+to+failure+meta-regressions'],['Refalo et al. 2023 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Refalo+proximity-to-failure+hypertrophy+meta-analysis']]],
['Músculo estirado','Prioriza ejercicios y rangos donde el músculo trabaja estirado: curl femoral sentado, tríceps sobre la cabeza, press inclinado profundo, talones con pausa abajo.','Varios ensayos encuentran más crecimiento entrenando en longitudes musculares largas. Los parciales en estiramiento rinden igual o más que el rango completo y claramente más que los parciales cortos.',[['Maeo et al. 2021 · Med Sci Sports Exerc (curl sentado)','https://doi.org/10.1249/MSS.0000000000002523'],['Maeo et al. 2023 · Eur J Sport Sci (tríceps sobre la cabeza)','https://doi.org/10.1080/17461391.2022.2100279'],['Wolf et al. 2023 · Int J Strength Cond (rango de movimiento)','https://doi.org/10.47206/ijsc.v3i1.182'],['Kassiano et al. 2023 · J Strength Cond Res (gemelos)','https://pubmed.ncbi.nlm.nih.gov/?term=Kassiano+gastrocnemius+partial+range+long+muscle+lengths']]],
['Carga y repeticiones','6–10 reps en básicos y 10–20 en aislamientos.','Con series cerca del fallo, cargas desde ~30 % del 1RM producen una hipertrofia parecida; las cargas altas ganan en fuerza máxima.',[['Schoenfeld et al. 2017 · J Strength Cond Res','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+low-+vs+high-load+resistance+training+meta-analysis']]],
['Descanso','2–3 min en básicos, 75–90 s o más en aislamientos.','Descansar más de 60 s da un beneficio pequeño, probablemente porque mantienes el volumen de carga; más allá de 90 s no se detectan diferencias claras.',[['Singer et al. 2024 · Front Sports Act Living','https://doi.org/10.3389/fspor.2024.1429789']]],
['Frecuencia','Cada músculo 2 veces por semana.','Con el volumen igualado, la frecuencia influye poco en el tamaño; repartir las series mejora la calidad de cada una y ayuda a la fuerza.',[['Schoenfeld et al. 2016 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+2016+resistance+training+frequency+hypertrophy+meta-analysis'],['Pelland et al. 2026 · Sports Med','https://sportrxiv.org/index.php/server/preprint/view/460']]],
['Tamaño del superávit','Si haces superávit, que sea pequeño: +5–10 % de tus calorías y ~0,25 % de tu peso por semana.','Con superávits de 5 % y 15 % la ganancia muscular fue parecida; subir de peso más rápido sumó sobre todo grasa.',[['Helms et al. 2023 · Sports Med Open 9:102','https://doi.org/10.1186/s40798-023-00651-y'],['Iraki et al. 2019 · Sports 7:154','https://doi.org/10.3390/sports7070154']]],
['Recomposición','Con más grasa y poca experiencia puedes ganar músculo comiendo en mantenimiento o en un ligero déficit.','Está bien documentada en principiantes y personas con sobrepeso, y también aparece en entrenados que comen proteína alta y progresan en el gym.',[['Barakat et al. 2020 · Strength Cond J 42(5)','https://doi.org/10.1519/SSC.0000000000000584']]],
['Proteína','1,6–2,2 g/kg al día repartidos en 3–5 comidas.','El beneficio sobre la masa muscular se estabiliza cerca de 1,6 g/kg (hasta ~2,2). Con más grasa corporal se calcula sobre un peso de referencia. El total diario manda: una comida grande también se aprovecha.',[['Morton et al. 2018 · Br J Sports Med','https://doi.org/10.1136/bjsports-2017-097608'],['Trommelen et al. 2023 · Cell Rep Med','https://doi.org/10.1016/j.xcrm.2023.101324']]],
['Creatina','3–5 g de creatina monohidrato al día, sin fase de carga.','Es el suplemento con más evidencia para fuerza y masa magra, y es seguro en personas sanas.',[['Kreider et al. 2017 · J Int Soc Sports Nutr','https://doi.org/10.1186/s12970-017-0173-z']]],
['Sueño','7–9 h por noche.','Una sola noche sin dormir redujo la síntesis de proteína muscular un 18 % en un ensayo controlado.',[['Lamon et al. 2021 · Physiol Rep','https://doi.org/10.14814/phy2.14660']]],
['Cardio','Sí puedes hacerlo: 8–10 mil pasos o 2–3 sesiones moderadas por semana.','Combinar cardio y pesas no frena la hipertrofia ni la fuerza máxima; puede restar algo de potencia si van en la misma sesión.',[['Schumann et al. 2022 · Sports Med','https://doi.org/10.1007/s40279-021-01587-7']]],
['Calibra tu RIR','Llega al fallo en algún aislamiento de vez en cuando para ajustar tu percepción.','Solemos subestimar cuántas repeticiones nos quedan, sobre todo lejos del fallo; la estimación mejora cerca de él.',[['Halperin et al. 2022 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Halperin+accuracy+predicting+repetitions+to+task+failure']]],
['Prioridad y orden','Los músculos de tu objetivo llevan más series y van primero en cada sesión.','El volumen semanal es lo que más pesa en el crecimiento de cada músculo. El orden casi no cambia la hipertrofia, pero lo que entrenas primero gana más fuerza porque llegas fresco.',[['Nunes et al. 2021 · Eur J Sport Sci 21(2):149','https://doi.org/10.1080/17461391.2020.1733672'],['Pelland et al. 2026 · Sports Med','https://sportrxiv.org/index.php/server/preprint/view/460']]],
['Variantes','Cambiar un ejercicio por su variante está bien; rotarlos cada sesión, no.','Variar de forma planificada (ángulos distintos para un mismo músculo) puede mejorar el desarrollo por regiones; cambiar al azar o muy seguido dificulta progresar en carga.',[['Kassiano et al. 2022 · J Strength Cond Res 36(6):1753','https://doi.org/10.1519/JSC.0000000000004258']]],
['Tempo','Baja controlado (~2 s) y sube con intención; sin repeticiones ultralentas.','Duraciones de repetición entre 0,5 y 8 s producen hipertrofia similar.',[['Schoenfeld et al. 2015 · Sports Med','https://pubmed.ncbi.nlm.nih.gov/?term=Schoenfeld+repetition+duration+hypertrophy+meta-analysis']]]];

 const v=$('#view');v.dataset.view=S.tab;v.classList.toggle('enter',S.tab!==lastTab&&!reduced());lastTab=S.tab;v.innerHTML=VIEWS[S.tab]();const bs=$('.brand span');if(bs){bs.textContent=S.prof.name||'Hipertrofia';bs.classList.toggle('named',!!S.prof.name)}paintSync();afterRender();S.justSet=null}
function go(tab,anchor){if(S.sheet)closeSheet();if(S.tab==='prog'&&tab!=='prog')markBadges();S.tab=tab;if(tab!=='ajustes')lsSet('bh-tab',tab);render();if(anchor){const el=document.getElementById(anchor);el&&el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'})}else window.scrollTo(0,0)}
function setNavH(){const n=$('#nav'),rail=matchMedia('(min-width:900px)').matches;document.documentElement.style.setProperty('--navh',rail||!n?'0px':Math.max(0,Math.round(innerHeight-n.getBoundingClientRect().top))+'px')}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-go],[data-act],[data-t]');if(!t)return;
 if(t.dataset.tab)return go(t.dataset.tab);if(t.dataset.go){const[a,b]=t.dataset.go.split(':');return go(a,b)}
 if(t.dataset.t){const v=t.dataset.t;if(v==='x')stopRest();else{T.end+=(+v)*1000;T.dur=Math.max(1,T.dur+(+v));lsSet('bh-timer',JSON.stringify({end:T.end,dur:T.dur,lab:T.lab}));tick()}return}
 const a=t.dataset.act,v=t.dataset.v,id=t.dataset.ex;
 switch(a){
 case'set':return doSet(id,+t.dataset.i);
 case'addset':{const plan=curPlan();if(!plan.ex.some(x=>x.id===id))return;if(!S.cur){S.pick=plan.day;S.cur=newSession(plan)}S.cur.plan.ex.find(x=>x.id===id).sets++;touchS(S.cur);return render()}
 case'guide':return openSheet(id,t.dataset.def,v==='var'?'var':null);
 case'guide-peek':if(S.sheet&&EX[v]){S.sheet.id=v;renderSheet();const b=$('#sh-box');b&&b.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})}return;
 case'guide-back':if(S.sheet){S.sheet.id=S.sheet.cur;renderSheet()}return;
 case'sheet-x':return closeSheet();
 case'demo-play':if(DEMO){if(DPLAY){DEMO.stop();setPlay(false)}else{DEMO.play();setPlay(true)}}return;
 case'demo-speed':DSPD=DSPD<1?1:.5;if(DEMO)DEMO.speed(DSPD);t.setAttribute('aria-pressed',String(DSPD<1));return;
 case'demo-step':if(DEMO){DEMO.show(+t.dataset.st);setPlay(false)}return;
 case'var-use':return useVariant(v);
 case'var-reset':{const sw={...(S.prof.swaps||{})};delete sw[v];setProf({swaps:sw});return toast('Ejercicio original restaurado')}
 case'plates':S.open['p'+id]=!S.open['p'+id];return render();
 case'finish':return finish();
 case'discard':if(askConfirm('discard'))discard();else render();return;
 case'pickday':S.open.pick=!S.open.pick;return render();
 case'day':S.pick=+v;S.open.pick=false;return render();
 case'sumx':S.summary=null;return render();
 case'allb':S.open.allB=!S.open.allB;return render();
 case'intro':S.open.introSeen=1;lsSet('bh-intro','1');return render();
 case'new-x':lsSet('bh-v3','1');return render();
 case'new-go':lsSet('bh-v3','1');return go('plan','medida');
 case'days':return setProf({days:+v});
 case'lvl':return setProf({lvl:v});
 case'goal':{const had=Object.keys(S.prof.pri||{}).length;setProf({goal:v,pri:{}});return toast('Enfoque: '+FOCUS[v][0]+(had?' · prioridades del objetivo':''))}
 case'pri':{const P=priOf(S.prof),nx=[1,2,0][P[v]],base=FOCUS[focusOf(S.prof)][2][v]??1,pri={...(S.prof.pri||{})};if(nx===base)delete pri[v];else pri[v]=nx;return setProf({pri})}
 case'pri0':return setProf({pri:{}});
 case'equip':return setProf({equip:v});
 case'mins':return setProf({mins:+v});
 case'ai-go':return aiGo();
 case'ai-ex':S.ai.q=v;{const q=$('#aiq');if(q)q.value=v}return aiGo();
 case'ai-apply':return aiApply();
 case'ai-cancel':S.ai.res=null;S.ai.err='';return render();
 case'ai-undo':return aiUndo();
 case'week':{const W=wk();return setProf({mesoStart:W.done-(+v-1)*S.prof.days})}
 case'phase':return setProf({phase:v});
 case'sex':return setProf({sex:v,setup:true});
 case'adj':setProf({kcalAdj:(S.prof.kcalAdj||0)+(+v)});return toast('Ajuste aplicado: '+(+v>0?'+':'−')+Math.abs(+v)+' kcal/día');
 case'adj0':return setProf({kcalAdj:0});
 case'wsave':return saveWeight();
 case'range':S.range=+v;return render();
 case'dels':if(askConfirm('s'+v)){delSession(v);toast('Sesión borrada')}return render();
 case'delw':if(askConfirm('w'+v)){delWeight(v);toast('Registro borrado')}return render();
 case'coach':return coach('');
 case'ask':{const q=($('#cq')||{}).value||'';if(!q.trim()){toast('Escribe tu pregunta.');return}S.coach.q=q;return coach(q.trim())}
 case'stop':S.coach.ctl&&S.coach.ctl.abort();return;
 case'coach-copy':return copyCoach();
 case'exp':return saveFile('bitacora-respaldo-'+ymd()+'.json',JSON.stringify(pack(snap())),'application/json');
 case'imp':return $('#impf').click();
 case'csv':return saveFile('bitacora-hipertrofia.csv',csv(),'text/csv');
 case'install':if(S.bip){const p=S.bip;S.bip=null;try{await p.prompt();const r=await p.userChoice;if(r&&r.outcome==='accepted')toast('Instalando la Bitácora…')}catch(err){}render()}return;
 case'inst-x':lsSet('bh-inst-x','1');return render();
 case'ob':S.ob[t.dataset.k]=t.dataset.k==='days'?+v:v;return render();
 case'ob-go':return submitOb();
 case'sync-on':return SY.connect(($('#tok')||{}).value);
 case'sync-now':return SY.run();
 case'sync-off':if(askConfirm('syncoff')){SY.disconnect();toast('Sincronización desconectada')}return render();
 case'theme':theme=v;lsSet('bh-theme',v);applyTheme();return render();
 case'pal':setProf({pal:v});applyPal();return}});
$('#view').addEventListener('input',e=>{const t=e.target;if(t.dataset.k&&t.dataset.f){const d=S.draft[t.dataset.k]=S.draft[t.dataset.k]||{};d[t.dataset.f]=t.dataset.f==='q'?+t.value:t.value;saveDraft()}if(t.id==='cq')S.coach.q=t.value;if(t.id==='aiq')S.ai.q=t.value;if(t.id&&t.id.startsWith('ob-')){const k=t.id.slice(3);S.ob[k]=t.value;if(S.ob.err&&S.ob.err[k]){delete S.ob.err[k];t.removeAttribute('aria-invalid');const m=$('#ob-'+k+'-e');m&&m.remove()}}});
$('#view').addEventListener('change',e=>{const t=e.target;if(t.id==='exsel'){S.exSel=t.value;return render()}const k=t.dataset.p;if(!k)return;
 if(k==='name')return setProf({name:String(t.value).trim().replace(/\s+/g,' ').slice(0,40)});
 if(k==='neat'||k==='bar')return setProf({[k]:+t.value});const v=k==='h'?cmH(num(t.value)):num(t.value),lim={age:[14,90],h:[130,220],w:[35,300],sportH:[0,30],neck:[25,60],waist:[50,200],hip:[60,200],bf:[3,60]}[k];
 if(v==null){if(['age','h','w'].includes(k)){toast('Este dato es necesario.');return render()}return setProf({[k]:k==='sportH'?0:null})}
 if(lim&&(v<lim[0]||v>lim[1])){toast(`Valor fuera de rango (${lim[0]}–${lim[1]}).`);return render()}setProf({[k]:v,setup:true})});
$('#view').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.dataset&&t.dataset.k&&!t.readOnly&&!t.disabled){e.preventDefault();const i=t.dataset.k.lastIndexOf('-');t.blur();doSet(t.dataset.k.slice(0,i),+t.dataset.k.slice(i+1));return}if(t.id==='wk'||t.id==='wwa'){e.preventDefault();t.blur();saveWeight();return}if(t.id==='tok'){e.preventDefault();t.blur();SY.connect(t.value);return}
 if(t.id==='aiq'&&!e.shiftKey){e.preventDefault();S.ai.q=t.value;t.blur();aiGo();return}
 const oi=OBF.indexOf(t.id);if(oi>=0){e.preventDefault();if(oi<OBF.length-1){const n=$('#'+OBF[oi+1]);n&&n.focus()}else{t.blur();submitOb()}return}
 if(t.dataset&&t.dataset.p&&t.dataset.p!=='neat'&&t.dataset.p!=='bar'){e.preventDefault();t.blur()}});$('#impf').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text()),r=await importData(o);toast(r.changed?`Respaldo importado: ${Math.max(0,r.addS)} sesiones y ${Math.max(0,r.addW)} registros de peso nuevos.`:'Ya tenías todo: no hubo cambios.')}catch(err){toast(err&&err.message&&/respaldo/i.test(err.message)?err.message:'No se pudo leer el archivo.')}});
$('#updb').addEventListener('click',()=>{if(!S.upd)return;store.flush();S.updating=true;S.upd.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),3000)});
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{setNavH();document.querySelectorAll('#view [data-chart]').forEach(el=>{el.dataset.chart==='w'?chW(el):chE(el)})},150)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.cur)wake();if(!$('#timer').hidden)tick();if(SY.cfg)SY.schedule(400)}else{store.flush();lsSet('bh-draft',JSON.stringify({at:Date.now(),d:S.draft}));if(SY.cfg&&SY.state==='pending')SY.run()}});
addEventListener('pagehide',()=>store.flush());
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='peso'){go('prog','peso');setTimeout(()=>{const i=$('#wk');i&&i.focus()},350)}else if(VIEWS[h])go(h)});

/* ---------- arranque ---------- */
const h0=location.hash.slice(1),t0=lsGet('bh-tab');S.tab=VIEWS[h0]?h0:h0==='peso'?'prog':VIEWS[t0]?t0:'hoy';
if(BUILD==='pwa'){theme=lsGet('bh-theme')||'auto';applyTheme()}
try{const d=JSON.parse(lsGet('bh-draft')||'null');if(d&&d.at>Date.now()-6*36e5)S.draft=d.d||{}}catch(e){}
render();setNavH();store.init();restoreTimer();
if(h0==='peso')setTimeout(()=>{const el=$('#peso');el&&el.scrollIntoView({block:'start'});const i=$('#wk');i&&i.focus()},300);
if(BUILD==='art'){(async()=>{try{if(window.claude&&claude.use){const[sm,dlc]=await Promise.all([claude.use('sample'),claude.use('downloads')]);S.sample=sm||null;S.dl=dlc||null}else S.sample=null}catch(e){S.sample=null}requestRender()})()}
else{
 if(h0)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.bip=e;requestRender()});
 addEventListener('appinstalled',()=>{S.bip=null;lsSet('bh-inst-x','1');toast('Bitácora instalada');requestRender()});
 try{matchMedia('(display-mode: standalone)').addEventListener('change',()=>requestRender())}catch(e){}
 if('serviceWorker'in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{const w=x=>{if(x&&navigator.serviceWorker.controller){S.upd=x;paintUpd()}};w(reg.waiting);reg.addEventListener('updatefound',()=>{const n=reg.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed')w(n)})});
   setInterval(()=>reg.update().catch(()=>{}),36e5);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})}).catch(err=>console.warn('sw',err))});
  let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!S.updating)return;rl=true;location.reload()})}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist()})}catch(e){}
}
})();
